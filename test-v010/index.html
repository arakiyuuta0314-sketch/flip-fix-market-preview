/* TOWN REVIVAL • vertical slice v0.4 */
:root{--base:#112032;--panel:#21334b;--panel2:#28415d;--stroke:#435c70;--gold:#ffcf75;--mint:#88ebc7}
body{background:radial-gradient(ellipse at top,#1c4560 0,#12273b 56%,#101b2b 100%)}
 .diagnose-grid,.assembly-grid,.power-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}
 .diagnose-cell,.assembly-piece,.power-switch{min-width:0;min-height:71px;background:#244052;color:#e7f7ed;border:2px solid #598a91;border-radius:12px;padding:7px 4px;text-align:center;font-weight:850;touch-action:manipulation}
 .diagnose-cell small,.assembly-piece small,.power-switch small{display:block;color:#bcd8d6;font-size:10px}
 .diagnose-cell strong{display:block;font-size:19px;line-height:1.4}
 .diagnose-cell.fault{border-color:#598a91;background:#244052}
 .diagnose-cell.fixed,.assembly-piece.placed{background:#285b4f;opacity:.45}
 .assembly-piece.active{outline:3px solid #ffcf75;background:#405b6a}
 .power-switch.on{border-color:#8eebc8;background:#336e60;color:#fff8cc}
 .assembly-blueprint{background:#182f43;border:1px solid #517783;border-radius:12px;padding:9px;color:#ffdf91;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
 .assembly-blueprint b{background:#30566b;border-radius:7px;min-width:23px;text-align:center;padding:3px 4px}
 .assembly-blueprint .done{color:#92e9bf;background:#235647}
 .power-target{display:flex;justify-content:space-between;align-items:center;background:#1c3f4e;padding:11px;border-radius:12px;gap:9px}
 .power-target strong{font-size:21px;color:#ffdd8b}
 .power-progress{height:11px;background:#192b39;border-radius:9px;margin:9px 0;overflow:hidden}
 .power-progress>span{height:100%;display:block;background:linear-gradient(90deg,#78bacc,#90edb6);border-radius:9px}
 @media(max-width:650px){.diagnose-grid,.assembly-grid,.power-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.diagnose-cell,.assembly-piece,.power-switch{min-height:59px;font-size:12px}.diagnose-cell strong{font-size:16px}}
 .town-hotspot{cursor:pointer;outline:none;touch-action:manipulation}
 .town-hotspot .tap-sign rect{fill:#17495be8;stroke:#fff4a7;stroke-width:3}
 .town-hotspot .tap-sign text{font-size:17px;font-weight:900;fill:#fff5db;pointer-events:none}
 .town-hotspot:hover .tap-sign rect,.town-hotspot:focus .tap-sign rect{fill:#25818b;stroke:#fff5b4}
 .town-hotspot .tap-hit{fill:transparent;stroke:transparent}
 .town-scene-tip{position:absolute;right:10px;top:10px;z-index:4;background:#153d52dc;color:#ffe4a3;border:1px solid #c2dace;border-radius:9px;padding:4px 7px;font-size:11px;font-weight:850;pointer-events:none}
 .repair-mode .town-scene-tip,.repair-mode .town-hotspot .tap-sign{display:none}
 .town-compare{display:flex;align-items:center;justify-content:center;gap:7px;margin:4px 0}

let sceneReveal=null;
let devPanelOpen=false;
let evolutionTimers=[];
function cancelEvolution(){for(const id of evolutionTimers)clearTimeout(id);evolutionTimers=[];}
function beginEvolution(kind,from,to){
 cancelEvolution();
 const token=sceneReveal={kind,from,to,phase:'flash'};
 evolutionTimers.push(setTimeout(()=>{if(sceneReveal!==token)return;token.phase='view';render();},1700));
 evolutionTimers.push(setTimeout(()=>{if(sceneReveal!==token)return;token.phase='summary';render();},2900));
}

function handleDevAction(action){
 if(!DEV_MODE||!action.startsWith('dev-'))return false;
 if(action==='dev-toggle'){devPanelOpen=!devPanelOpen;render();return true;}
 const readInt=(sel,min,max)=>{const value=Number(app.querySelector(sel)?.value);if(!Number.isFinite(value)||!Number.isInteger(value)||value<min||value>max)throw Error('Invalid dev input: '+sel);return value;};
 if(action==='dev-apply'){
  const town=readInt('#dev-town',1,MAX_TOWN_LEVEL),house=readInt('#dev-house',0,4),
   cash=readInt('#dev-cash',0,100000000),completed=readInt('#dev-completed',0,1000000);
  cancelEvolution();sceneReveal=null;state.townLevel=town;state.houseLevel=house;state.coins=cash;state.completed=completed;state.active=null;
  state.inventory=[];state.offers=[];refillOffers();currentTab='shop';mutate();return true;
 }
 if(action==='dev-repair'){
  const type=app.querySelector('#dev-stage')?.value;
  if(!DEV_STAGE_NAMES.some(x=>x[0]===type))throw Error('Invalid stage type');
  const difficulty=readInt('#dev-difficulty',1,5);
  cancelEvolution();sceneReveal=null;state.houseLevel=Math.max(state.houseLevel,minimumHouse(difficulty));
  const kind=KIND.find(x=>x.level<=state.townLevel)||KIND[0];
  state.active={id:state.nextId++,kind:kind.id,name:kind.name,baseValue:kind.base+(difficulty-1)*170,purchasePrice:0,price:0,difficulty,
  rarity:'DEV',stages:[{type,seed:rnd(10001,1000000)}],stageIndex:0,stageState:{},integrity:100,complete:false,broken:false,shield:false,isContract:false};
  initStage();currentTab='work';devPanelOpen=false;mutate();return true;
 }
 if(action==='dev-refresh'){state.offers=[];refillOffers();state.inventory=[];state.active=null;currentTab='market';mutate();return true;}
 if(action==='dev-reset'){
  if(!confirm('Reset the development save slot only?'))return true;
  storage.removeItem(DEVELOPMENT_KEY);
  cancelEvolution();sceneReveal=null;state=baseSave();refillOffers();currentTab='shop';devPanelOpen=false;mutate();return true;
 }
 throw Error('Unknown development action: '+action);
}

function townAction(action,id){
 if(action==='focus-growth'){
  currentTab=id==='town'?'shrine':'shop';render();
  const target=app.querySelector(id==='town'?'#offering-target':'#growth-guide');
  target?.scrollIntoView({block:'nearest',behavior:'auto'});
  return true;
 }
 if(action==='reveal-dismiss'){cancelEvolution();sceneReveal=null;render();return true;}
 if(action==='language'){state.locale=id==='en'?'en':'ja';persist();render();return true;}
 if(action==='story-done'){state.storySeen=true;mutate();notify(L('修理屋、開店！','The repair shop is open!'),'good');return true;}
 if(action==='house-up'){const cost=houseCost();if(state.houseLevel>=4||state.coins<cost)return true;const from=state.houseLevel;state.coins-=cost;state.spent+=cost;state.houseLevel++;beginEvolution('house',from,state.houseLevel);mutate();return true;}
 if(action==='offer-town'){
  const price=townCost();if(!price||state.coins<price||state.completed<1)return true;
  const from=state.townLevel;state.coins-=price;state.spent+=price;state.townLevel++;beginEvolution('town',from,state.townLevel);
  state.offers=[];refillOffers();currentTab='shrine';mutate();return true;
 }
 if(action==='fund-project'){
  const p=CITY_PROJECTS.find(x=>x.id===id);
  if(!p||state.townLevel<p.level||state.coins<p.cost||state.projects?.[p.id])return true;
  state.coins-=p.cost;state.spent+=p.cost;state.projects[p.id]=true;
  state.tools[p.tool]=(state.tools[p.tool]||0)+p.amount;
  mutate();notify(L(p.name[0],p.name[1])+L(' 完成！',' built!'),'good');return true;
 }
 if(action==='talk'){const r=RESIDENTS.find(x=>x.id===id);if(!r||!characterAvailable(r))return true;const key=state.completed+state.townLevel*100;if(state.residentSeen[id]===key)return true;state.residentSeen[id]=key;state.residentLove[id]=Math.min(5,(state.residentLove[id]||0)+1);mutate();notify(residentName(r)+': '+residentText(r.lines[Math.min(2,Math.floor((state.residentLove[id]-1)/2))]),'good');return true;}
 if(action==='resident-event'){
  const config=RESIDENT_EVENTS[id],resident=RESIDENTS.find(r=>r.id===id);
  if(!config||!resident||!characterAvailable(resident)||state.eventsDone[id])return true;
  state.eventsDone[id]=true;
  state.residentLove[id]=Math.min(5,(state.residentLove[id]||0)+2);
  state.tools[config.tool]=(state.tools[config.tool]||0)+config.amount;
  mutate();
  notify(L(config.ja+' 成功！','Event completed: '+config.en)+' '+L('報酬を獲得','Reward earned'),'good');
  return true;
 }
 return false;
}

function translateDOM(){if(state.locale!=='en')return;const walk=document.createTreeWalker(app,NodeFilter.SHOW_TEXT);const nodes=[];while(walk.nextNode())nodes.push(walk.currentNode);for(const node of nodes){let txt=node.nodeValue;for(const [ja,en] of Object.entries(TRANSLATIONS).sort((a,b)=>b[0].length-a[0].length)){if(ja&&txt.includes(ja))txt=txt.split(ja).join(en);}node.nodeValue=txt;}}

function cleanLocations(count,seed){const pos=[];let x=seed>>>0;for(let i=0;i<count;i++){x=(1664525*x+1013904223)>>>0;const xp=19+(x%63);x=(1664525*x+1013904223)>>>0;const yp=22+(x%55);pos.push([xp,yp]);}return pos;}

 if(t.type==='wires'){const count=st.count,order=shuffleIndex(count,t.seed);let paths='';for(let i=0;i<count;i++)if(st.done.includes(i)){const y1=(15+ i*(145/(count-1)) +18),k=order.indexOf(i),y2=(15+k*(145/(count-1))+18);paths+=`<path d="M55 ${y1} C130 ${y1},125 ${y2},${290} ${y2}" stroke="${COLORS[i]}" stroke-width="5" fill="none" stroke-linecap="round" opacity=".85"/>`;}

 if(t.type==='circuit'){const path=circuitPath(a.difficulty);const aMap=new Map(path.map((v,i)=>[v,i]));inside=`<div class="circuit-panel"><div class="circuit-labels"><b>⚡ INPUT</b><span>タップで90°回転</span><b>OUTPUT ⚡</b></div><div class="circuit-grid">${Array.from({length:9},(_,slot)=>{const i=aMap.get(slot);if(i===undefined)return '<div class="circuit-empty"></div>';const dir=circuitConnectors(path,i),angle=st.angles[i];return `<button class="circuit-tile" data-action="circuit-turn" data-id="${i}" aria-label="回路パネル ${i+1} を回転"><svg viewBox="0 0 100 100" aria-hidden="true"><g transform="rotate(${angle*90},50,50)"><circle cx="50" cy="50" r="15" fill="#fed58f"/>${dir.map(d=>{const e=[[50,0],[100,50],[50,100],[0,50]][d];return `<path d="M50 50 L${e[0]} ${e[1]}" stroke="#94efcc" stroke-width="13" stroke-linecap="round"/>`;}).join('')}</g></svg></button>`;}).join('')}</div></div><p class="game-tip">緑の配線が入口と出口をつなぐように回転。すべて通れば成功！</p>`;}

   <div class="diagnose-grid">${Array.from({length:3+a.difficulty},(_,i)=>{

   }).join('')}</div><p class="game-tip">${found.length}/${targets.length} ${L('故障部品を交換','faulty parts replaced')}</p>`;
 }
 if(t.type==='assemble'){

   const installedParts=placed.map(slot=>order[slot]);
   inside=`<div class="game-tip">${L('① 部品を選ぶ → ② 必要なら向きを回す → ③ 対応する設計図の穴にはめ込む','1. Select a part → 2. Rotate if needed → 3. Tap its matching blueprint socket')}</div>

   const voltage=weights.reduce((v,w,i)=>v+(enabled.includes(i)?w:0),0);

 return `<div class="eyebrow">REPAIR TASK ${a.stageIndex+1} / ${a.stages.length}</div><div class="minigame"><h3>${def.icon} ${def.name}</h3><p>${def.tip}</p>${inside}</div><div class="hint section-block">⚠️ 修理ミスで本体耐久度が減少。残り12%以下になると修復不能。保護フィルムは次のミスを1回防ぎます。</div>`;

function bindCleaning(){const pad=document.getElementById('clean-pad');if(!pad)return;
 const hit=(event)=>{const a=state.active,t=taskOf();if(!a||!t||t.type!=='clean')return;const r=pad.getBoundingClientRect();if(r.width===0)return;const x=(event.clientX-r.left)/r.width*100,y=(event.clientY-r.top)/r.height*100;const spots=cleanLocations(a.stageState.count,t.seed);
 let changed=false;for(let i=0;i<spots.length;i++){const [sx,sy]=spots[i];if(Math.abs((x-sx)*r.width/100)<30&&Math.abs((y-sy)*r.height/100)<26&&!a.stageState.cleaned.includes(i)){a.stageState.cleaned.push(i);const el=pad.querySelector(`[data-spot="${i}"]`);if(el)el.classList.add('is-clean');changed=true;}}
 if(changed){persist();const label=pad.parentElement?.querySelector('.game-tip');if(label)label.textContent=`${a.stageState.cleaned.length}/${a.stageState.count} 個の汚れを除去 • マウス/指でなぞる`;if(a.stageState.cleaned.length===a.stageState.count){dragging=false;finishStep();}}
 };
 pad.addEventListener('pointerdown',e=>{dragging=true;pad.setPointerCapture?.(e.pointerId);hit(e);});pad.addEventListener('pointermove',e=>{if(dragging)hit(e)});pad.addEventListener('pointerup',()=>dragging=false);pad.addEventListener('pointercancel',()=>dragging=false);
}
function startCalibration(){const task=taskOf();if(!task)return;const needle=document.getElementById('needle');if(!needle)return;lastTiming=50;calibratePressTiming=null;let start=performance.now();let seed=task.seed;const speed=.0018+state.active.difficulty*.00055;function draw(time){lastTiming=50+47*Math.sin((time-start)*speed+seed%11);needle.style.left=lastTiming+'%';timingRaf=requestAnimationFrame(draw);}timingRaf=requestAnimationFrame(draw);}
function activate(id){if(state.active)return notify('先に作業台の修理を終えてください。','error');const ix=state.inventory.findIndex(x=>x.id===id);if(ix<0)return;
 if(!canRepairDifficulty(state.inventory[ix].difficulty)){notify(L('この修理には工房 LV.'+minimumHouse(state.inventory[ix].difficulty)+' の設備が必要です。改装してください。','This job requires WORKSHOP LV.'+minimumHouse(state.inventory[ix].difficulty)+'. Renovate your house first.'),'error');currentTab='shop';render();return;}
 const a=state.inventory.splice(ix,1)[0];a.stageIndex=0;a.integrity=100;a.complete=false;a.broken=false;a.shield=false;state.active=a;initStage();currentTab='work';mutate();}
function resetAll(){if(confirm('すべての進行状況を削除してニューゲームを始めますか？この操作は取り消せません。')){cancelEvolution();sceneReveal=null;state=baseSave();refillOffers();currentTab='shop';mutate();notify(L('新しいお店をオープン！','New game started!'),'good');}}
function handleAction(action,id){
 if(DEV_MODE&&handleDevAction(action))return;
 if(sceneReveal && sceneReveal.phase!=='summary' && action!=='reset')return;
 if(townAction(action,id))return;
 if(action==='tab'){currentTab=id;selectedWire=-1;render();return;}
 if(action==='reset'){resetAll();return;}
 if(action==='refresh'){if(state.coins<25)return notify('お金が足りません','error');state.coins-=25;state.spent+=25;state.offers=[];refillOffers();mutate();notify('新しい商品が入荷！');return;}
 if(action==='buy'){
 const ix=state.offers.findIndex(x=>String(x.id)===String(id));if(ix<0)return;const offer=state.offers[ix],price=marketPrice(offer);
 if(state.coins<price)return notify('資金が足りません','error');if(state.inventory.length+(state.active?1:0)>=limit())return notify('倉庫が満杯です','error');
 state.coins-=price;state.spent+=price;state.inventory.push({...offer,purchasePrice:price});state.offers.splice(ix,1);refillOffers();mutate();notify(`${offer.name} を仕入れた！`,'good');return;
 }
 if(action==='resell-inventory'){
  const index=state.inventory.findIndex(x=>String(x.id)===String(id));
  if(index<0)return;
  const o=state.inventory[index],salvage=Math.max(1,Math.round(o.purchasePrice*.25));
  if(!confirm(L('未修理の'+o.name+'を $'+n(salvage)+' で売却しますか？','Sell the unrepaired item for $'+n(salvage)+'?')))return;
  state.inventory.splice(index,1);state.coins+=salvage;state.revenue+=salvage;mutate();
  notify(L('未修理品を売却しました','Item sold as-is'),'good');
  return;
 }
 if(action==='timed-start'){
  if(state.active||state.townLevel<2||state.completed<1)return;
  const m=timedChallenge();if(state.coins<m.deposit)return;
  const stages=offerStages(m.kind,m.difficulty).slice(0,m.stageCount);
  state.coins-=m.deposit;
  const now=Date.now();
  state.active={id:state.nextId++,kind:m.kind.id,name:m.kind.name,difficulty:m.difficulty,
   baseValue:m.kind.base,purchasePrice:0,price:0,rarity:'RUSH',stageIndex:0,stages,stageState:{},
   integrity:100,complete:false,broken:false,shield:false,isTimed:true,budget:m.budget,startedAt:now,
   deadline:now+m.budget*1000,reward:m.reward,deposit:m.deposit};
  initStage();currentTab='work';mutate();return;
 }
 if(action==='timed-abandon'){if(!state.active?.isTimed)return;if(confirm(L('特別依頼を中止すると保証金は返金されません。中止しますか？','Abandoning forfeits your deposit. Continue?')))finishTimed(false);return;}
 if(action==='activate'){activate(Number(id));return;}
 if(action==='contract'){if(state.active||state.inventory.length||state.coins>=Math.min(...state.offers.map(marketPrice)))return;const o=generateOffer(1);o.kind='handheld';o.name='お客さんの携帯ゲーム機';o.baseValue=115;o.price=0;o.purchasePrice=0;o.isContract=true;o.stages=[{type:'clean',seed:rnd(101,99999)},{type:'wires',seed:rnd(101,99999)}];o.stageIndex=0;o.integrity=100;o.complete=false;o.broken=false;o.shield=false;state.active=o;initStage();currentTab='work';mutate();notify('小口修理を引き受けた！','good');return;}
 if(action==='wire-start'){const a=state.active;if(!a||taskOf()?.type!=='wires')return;if(a.stageState.done.includes(Number(id)))return;selectedWire=Number(id);render();return;}
 if(action==='wire-end'){const a=state.active;if(!a||taskOf()?.type!=='wires'||selectedWire<0)return;const result=Number(id)===selectedWire;const src=selectedWire;selectedWire=-1;if(result){if(!a.stageState.done.includes(src))a.stageState.done.push(src);if(a.stageState.done.length===a.stageState.count)finishStep();else mutate();}else damage();return;}
 if(action==='screw-start'){const a=state.active;if(!a||taskOf()?.type!=='screws')return;a.stageState.started=true;mutate();return;}
 if(action==='screw-turn'){const a=state.active;if(!a||taskOf()?.type!=='screws'||!a.stageState.started)return;const st=a.stageState,seq=shuffleIndex(st.count,taskOf().seed),number=Number(id);if(st.removed.includes(number))return;if(number===seq[st.removed.length]){st.removed.push(number);if(st.removed.length===st.count)finishStep();else mutate();}else{st.started=a.difficulty<=2;damage();}return;}
 if(action==='circuit-turn'){const a=state.active;if(!a||taskOf()?.type!=='circuit')return;const i=Number(id),path=circuitPath(a.difficulty);if(!Number.isInteger(i)||i<0||i>=path.length)return;a.stageState.angles[i]=(a.stageState.angles[i]+1)%4;if(solvedCircuit(a))finishStep();else mutate();return;}
 if(action==='diagnose-check'){
 const a=state.active,t=taskOf();if(!a||!t||t.type!=='diagnose')return;
 const target=diagnosisTargets(t.seed,a.difficulty),idx=Number(id);if(!Number.isInteger(idx)||idx<0||idx>=3+a.difficulty||a.stageState.found.includes(idx))return;
 if(target.includes(idx)){a.stageState.found.push(idx);if(a.stageState.found.length===target.length)finishStep();else mutate();}else damage();
 return;
 }
 if(action==='assemble-select'){
  const a=state.active,t=taskOf();if(!a||t?.type!=='assemble')return;
  const part=Number(id),st=a.stageState,order=assemblyOrder(t.seed,a.difficulty);
  if(!Number.isInteger(part)||part<0||part>=order.length||st.placed.some(slot=>order[slot]===part))return;
  st.selected=part;st.rotation=0;mutate();return;
 }
 if(action==='assemble-rotate'){
  const a=state.active,t=taskOf();if(!a||t?.type!=='assemble'||a.stageState.selected<0||a.difficulty<=2)return;
  a.stageState.rotation=(a.stageState.rotation+1)%4;mutate();return;
 }
 if(action==='assemble-socket'){
  const a=state.active,t=taskOf();if(!a||t?.type!=='assemble')return;
  const st=a.stageState,slot=Number(id),order=assemblyOrder(t.seed,a.difficulty);
  if(!Number.isInteger(slot)||slot<0||slot>=order.length||st.placed.includes(slot)||st.selected<0)return;
  if(st.selected===order[slot]&&st.rotation===assemblyOrientation(t.seed,slot,a.difficulty)){
   st.placed.push(slot);st.selected=-1;st.rotation=0;
   if(st.placed.length===order.length)finishStep();else mutate();
  }else{
   st.selected=-1;st.rotation=0;damage();
  }
  return;
 }
 if(action==='power-toggle'){
 const a=state.active,t=taskOf();if(!a||!t||t.type!=='power')return;
 const idx=Number(id),weights=powerWeights(a.difficulty);if(!Number.isInteger(idx)||idx<0||idx>=weights.length)return;
 const enabled=a.stageState.enabled;const old=enabled.indexOf(idx);if(old>=0)enabled.splice(old,1);else enabled.push(idx);mutate();return;
 }
 if(action==='power-test'){
 const a=state.active,t=taskOf();if(!a||!t||t.type!=='power')return;
 const voltage=powerWeights(a.difficulty).reduce((v,w,i)=>v+(a.stageState.enabled.includes(i)?w:0),0);
 if(voltage===powerTarget(t.seed,a.difficulty))finishStep();else damage();
 return;
 }
 if(action==='time-stop'){const a=state.active,t=taskOf();if(!a||!t||t.type!=='calibrate')return;const center=25+(t.seed%51),width=clamp(24-a.difficulty*3,6,21);const reading=calibratePressTiming===null?lastTiming:calibratePressTiming;calibratePressTiming=null;if(Math.abs(reading-center)<=width/2+2)finishStep();else damage();return;}
 if(action==='buy-tool'){const tool=TOOLS.find(x=>x.id===id);if(!tool)return;if((TOOL_UNLOCK[id]||1)>state.townLevel)return;if(state.coins<tool.cost)return notify('お金が足りません','error');state.coins-=tool.cost;state.spent+=tool.cost;state.tools[id]++;mutate();notify(`${tool.name} を購入した！`,'good');return;}
 if(action==='use-tool'){const a=state.active,t=taskOf(),tool=TOOLS.find(x=>x.id===id);if(!a||!t||!tool||!state.tools[id]||a.complete||a.broken)return;
 if(tool.stage&&tool.stage!==t.type)return; if(a.isTimed&&id==='auto')return notify(L('時間制限依頼では全自動修理は使えません','Auto-repair cannot be used in rush contracts'),'error'); if(id==='shield'){if(a.shield)return;state.tools.shield--;a.shield=true;mutate();notify('🛡️ 次の失敗を1回防ぎます','good');return;}
 state.tools[id]--;
 if(id==='auto'){a.stageIndex=a.stages.length;a.complete=true;a.quality=repairQuality(a);mutate();notify('⚡ 全工程の修理が完了！','good');return;}
 finishStep(true);return;
 }
 if(action==='sell'){const a=state.active;if(!a?.complete)return;const price=saleValue(a);state.coins+=price;state.revenue+=price;state.fame+=3+a.difficulty*3+(a.integrity===100?5:0);state.completed++;state.active=null;mutate();notify(`${a.name} を $${n(price)} で販売！`,'good');return;}
 if(action==='collect'){const a=state.active;if(!a?.complete||a.isContract)return;const points=Math.round((11+a.difficulty*15)*(state.upgrades.showcase?1.5:1));a.quality=repairQuality(a);state.collection.push(a);state.fame+=points;state.completed++;state.active=null;mutate();notify(`🏆 コレクション追加！ 評判 +${points}`,'good');return;}
 if(action==='scrap'){const a=state.active;if(!a)return;if(a.isTimed){finishTimed(false);return;}const salvage=a.isContract?0:(a.broken?Math.round(a.baseValue*.11):Math.round(a.purchasePrice*.24));if(!a.broken&&!confirm(`修理をやめて $${n(salvage)} で処分しますか？`))return;state.coins+=salvage;state.revenue+=salvage;state.active=null;mutate();notify(`部品を回収して $${n(salvage)} を得た`);return;}
 if(action==='upgrade'){const up=UPGRADES.find(x=>x.id===id);if(!up||state.upgrades[id]||state.coins<up.cost)return;state.coins-=up.cost;state.spent+=up.cost;state.upgrades[id]=true;mutate();notify(`${up.name} を導入した！`,'good');return;}
}
// A mobile tap should be judged at touch-down, before click delivery latency.
app.addEventListener('pointerdown',e=>{
 if(e.target.closest('[data-action="time-stop"]'))calibratePressTiming=lastTiming;
},{capture:true});
app.addEventListener('click',e=>{const c=e.target.closest('[data-action]');if(!c||c.disabled)return;handleAction(c.dataset.action,c.dataset.id);});
app.addEventListener('keydown',e=>{const c=e.target.closest('.town-hotspot[data-action]');if(!c||!(e.key==='Enter'||e.key===' '))return;e.preventDefault();handleAction(c.dataset.action,c.dataset.id);});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&currentTab==='work'&&taskOf()?.type==='calibrate'&&!e.repeat){e.preventDefault();handleAction('time-stop');}});
// Development-only diagnostic: sample actual game generation and sale formulas.
// No production save is read or modified; restore the active dev state after calculation.
if(DEV_MODE){
 window.__ffmBalance={
 sample(town,completed,count=600){
  if(!Number.isInteger(town)||town<1||town>MAX_TOWN_LEVEL||!Number.isInteger(completed)||completed<0||!Number.isInteger(count)||count<1||count>5000)throw Error('Invalid sample arguments');
  const previous=state;
  try {
   state={...baseSave(),townLevel:town,completed,houseLevel:4,nextId:1};
   const offers=Array.from({length:count},()=>generateOffer());
   const sample=offers.map(o=>{
    const pristine={...o,integrity:100};
    const dmg=11+o.difficulty*3;
    const once={...o,integrity:100-dmg};
    return {kind:o.kind,difficulty:o.difficulty,stages:o.stages.length,price:marketPrice(o),
      resale:saleValue(pristine),resaleOneMiss:saleValue(once),fee:o.price,
      normalProfit:saleValue(pristine)-marketPrice(o),oneMissProfit:saleValue(once)-marketPrice(o)};
   });
   const average=k=>Math.round(100*sample.reduce((v,x)=>v+x[k],0)/sample.length)/100;
   return {town,completed,count,tier:tier(),townCost:townCost(),houseCost:houseCost(),
    averagePrice:average('price'),averageResale:average('resale'),averageProfit:average('normalProfit'),
    averageOneMissProfit:average('oneMissProfit'),averageStages:average('stages'),
    bestProfit:Math.max(...sample.map(x=>x.normalProfit)),worstProfit:Math.min(...sample.map(x=>x.normalProfit)),
    difficultyDistribution:[1,2,3,4,5].map(d=>sample.filter(x=>x.difficulty===d).length),
    kinds:[...new Set(sample.map(x=>x.kind))].sort(),
    averageJobsToNextTown:townCost()?Math.round(100*townCost()/average('normalProfit'))/100:0
   };
  } finally{state=previous;}
 }
 };
}
load();if(!blockedSave)render();
setInterval(()=>{
 if(blockedSave||!state?.active?.isTimed)return;
 const a=state.active,remaining=timeLeft(a);
 if(remaining===0){finishTimed(false);return;}
 const clock=app.querySelector('[data-timed-clock]');
 if(clock){const sec=Math.ceil(remaining/1000);clock.textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
 const bar=app.querySelector('[data-timed-bar]');if(bar)bar.style.width=100*remaining/(a.budget*1000)+'%';
 clock.classList.toggle('urgent',remaining<=30000);
 }
},200);
})();
