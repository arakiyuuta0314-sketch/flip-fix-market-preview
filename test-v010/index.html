/* TOWN REVIVAL • vertical slice v0.4 */
:root{--base:#112032;--panel:#21334b;--panel2:#28415d;--stroke:#435c70;--gold:#ffcf75;--mint:#88ebc7}
body{background:radial-gradient(ellipse at top,#1c4560 0,#12273b 56%,#101b2b 100%)}
 .diagnose-grid,.assembly-grid,.power-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}
 .diagnose-cell,.assembly-piece,.power-switch{min-width:0;min-height:71px;background:#244052;color:#e7f7ed;border:2px solid #598a91;border-radius:12px;padding:7px 4px;text-align:center;font-weight:850;touch-action:manipulation}
 .diagnose-cell small,.assembly-piece small,.power-switch small{display:block;color:#bcd8d6;font-size:10px}
 .diagnose-cell strong{display:block;font-size:19px;line-height:1.4}
 .diagnose-cell.fault{border-color:#598a91;background:#244052}
 .diagnose-cell.fixed,.assembly-piece.placed{background:#285b4f;opacity:.45}
 .assembly-piece.active{outline:3px solid #ffcf75;background:#405b6a}
 .power-switch.on{border-color:#8eebc8;background:#336e60;color:#fff8cc}
 .assembly-blueprint{background:#182f43;border:1px solid #517783;border-radius:12px;padding:9px;color:#ffdf91;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
 .assembly-blueprint b{background:#30566b;border-radius:7px;min-width:23px;text-align:center;padding:3px 4px}
 .assembly-blueprint .done{color:#92e9bf;background:#235647}
 .power-target{display:flex;justify-content:space-between;align-items:center;background:#1c3f4e;padding:11px;border-radius:12px;gap:9px}
 .power-target strong{font-size:21px;color:#ffdd8b}
 .power-progress{height:11px;background:#192b39;border-radius:9px;margin:9px 0;overflow:hidden}
 .power-progress>span{height:100%;display:block;background:linear-gradient(90deg,#78bacc,#90edb6);border-radius:9px}
 @media(max-width:650px){.diagnose-grid,.assembly-grid,.power-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.diagnose-cell,.assembly-piece,.power-switch{min-height:59px;font-size:12px}.diagnose-cell strong{font-size:16px}}
 .town-hotspot{cursor:pointer;outline:none;touch-action:manipulation}
 .town-hotspot .tap-sign rect{fill:#17495be8;stroke:#fff4a7;stroke-width:3}
 .town-hotspot .tap-sign text{font-size:17px;font-weight:900;fill:#fff5db;pointer-events:none}
 .town-hotspot:hover .tap-sign rect,.town-hotspot:focus .tap-sign rect{fill:#25818b;stroke:#fff5b4}
 .town-hotspot .tap-hit{fill:transparent;stroke:transparent}
 .town-scene-tip{position:absolute;right:10px;top:10px;z-index:4;background:#153d52dc;color:#ffe4a3;border:1px solid #c2dace;border-radius:9px;padding:4px 7px;font-size:11px;font-weight:850;pointer-events:none}

 const used=new Set(result.map(x=>x.type));

  let type=choices[rnd(0,choices.length-1)];

}

function residentSideConfig(id,chapter){
 const index=chapter-4;

 const story=RESIDENT_SIDE_STORIES[id]?.[index];
 if(!story)throw Error('Unknown side story '+id+'/'+chapter);
 return story;
}
function residentSideAvailable(r,chapter){

 return characterAvailable(r)&&!!state.eventsDone[r.id]&&!state.residentSideStories?.[key]&&
  (i===0||!!state.residentSideStories?.[r.id+'_0'])&&
  state.townLevel>=story.level&&(state.residentLove[r.id]||0)>=(i===0?2:3);
}

let sceneReveal=null;

let evolutionTimers=[];
function cancelEvolution(){for(const id of evolutionTimers)clearTimeout(id);evolutionTimers=[];}
function beginEvolution(kind,from,to){
 cancelEvolution();
 const token=sceneReveal={kind,from,to,phase:'flash'};
 evolutionTimers.push(setTimeout(()=>{if(sceneReveal!==token)return;token.phase='view';render();},1700));
 evolutionTimers.push(setTimeout(()=>{if(sceneReveal!==token)return;token.phase='summary';render();},2900));
}

function handleSceneAction(action){
 const e=state.pendingScene;if(!e)return false;
 if(action==='scene-start'&&e.type==='rush-intro'){
  const a=state.active;if(!a?.isTimed||!a.awaitingStart)throw Error('Missing rush intro');
  a.awaitingStart=false;currentTab='work';a.startedAt=Date.now();a.deadline=Date.now()+(a.stageSeconds||RUSH_SECONDS_PER_STAGE)*1000;
  state.pendingScene=null;mutate();return true;
 }
 if(action==='scene-start'&&e.type==='resident-intro'){
  const id=e.residentId,config=RESIDENT_EVENTS[id],chapter=e.chapter||1,story=residentChapterStory(id,chapter);
  const r=RESIDENTS.find(r=>r.id===id);
  const valid=chapter===1?!state.eventsDone[id]&&characterAvailable(r):
   chapter===2?residentFollowupAvailable(r):
   chapter===3?residentFinalAvailable(r):
   (chapter===4||chapter===5)?residentSideAvailable(r,chapter):false;
  if(!config||!r||state.active||!valid)throw Error('Invalid resident start');
  const m=chapter===3?{difficulty:Math.min(5,Math.max(4,state.houseLevel+2)),stages:story.stages.map(type=>({type,seed:rnd(101,99999)}))}:
   chapter===2?{difficulty:Math.min(5,Math.max(3,state.houseLevel+2)),stages:[story.stages[0],'diagnose',story.stages[1],'laser'].map(type=>({type,seed:rnd(101,99999)}))}:
   chapter>=4?{difficulty:Math.min(5,Math.max(3,state.houseLevel+2)),stages:story.stages.map(type=>({type,seed:rnd(101,99999)}))}:residentMission(id);
  const kind=KIND.find(k=>k.level<=state.townLevel)||KIND[0];
  state.active={id:state.nextId++,kind:kind.id,name:L(...(chapter>=2?[story.ja,story.en]:[config.ja,config.en])),difficulty:m.difficulty,residentChapter:chapter,
   price:0,purchasePrice:0,baseValue:0,rarity:'STORY',stages:m.stages,stageIndex:0,stageState:{},
   integrity:100,complete:false,broken:false,shield:false,isContract:true,residentId:id};
  state.pendingScene=null;currentTab='work';initStage();mutate();return true;
 }
 if(action==='scene-close'&&e.type==='town-finale'){
  state.townFinaleSeen=true;state.pendingScene=null;currentTab='shop';mutate();return true;
 }
 if(action==='scene-close'&&e.type==='resident-result'&&e.success){
  state.pendingScene={type:'resident-town-reveal',residentId:e.residentId,chapter:e.chapter};
  currentTab='shop';mutate();return true;
 }
 if(action==='scene-close'&&e.type==='resident-town-reveal'){
  if(e.chapter===3&&!state.townFinaleSeen&&allResidentFinals())state.pendingScene={type:'town-finale'};
  else state.pendingScene=null;
  currentTab='shop';mutate();return true;
 }
 if(action==='scene-close'&&['rush-result','resident-result','project-result','repair-complete','conversation'].includes(e.type)){
  state.pendingScene=null;mutate();return true;
 }
 return false;
}

  const town=readInt('#dev-town',1,MAX_TOWN_LEVEL),house=readInt('#dev-house',0,4),
   cash=readInt('#dev-cash',0,100000000),completed=readInt('#dev-completed',0,1000000);
  cancelEvolution();sceneReveal=null;state.pendingScene=null;state.townLevel=town;state.houseLevel=house;state.coins=cash;state.completed=completed;state.active=null;
  state.inventory=[];state.offers=[];refillOffers();currentTab='shop';mutate();return true;
 }
 if(action==='dev-repair'){
  const type=app.querySelector('#dev-stage')?.value;
  if(!DEV_STAGE_NAMES.some(x=>x[0]===type))throw Error('Invalid stage type');
  const difficulty=readInt('#dev-difficulty',1,5);
  cancelEvolution();sceneReveal=null;state.pendingScene=null;state.houseLevel=Math.max(state.houseLevel,minimumHouse(difficulty));
  const kind=KIND.find(x=>x.level<=state.townLevel)||KIND[0];
  state.active={id:state.nextId++,kind:kind.id,name:kind.name,baseValue:kind.base+(difficulty-1)*170,purchasePrice:0,price:0,difficulty,
  rarity:'DEV',stages:[{type,seed:rnd(10001,1000000)}],stageIndex:0,stageState:{},integrity:100,complete:false,broken:false,shield:false,isContract:false};
  initStage();currentTab='work';devPanelOpen=false;mutate();return true;
 }
 if(action==='dev-refresh'){state.pendingScene=null;state.offers=[];refillOffers();state.inventory=[];state.active=null;currentTab='market';mutate();return true;}
 if(action==='dev-reset'){
  if(!confirm('Reset the development save slot only?'))return true;
  storage.removeItem(DEVELOPMENT_KEY);
  cancelEvolution();sceneReveal=null;state=baseSave();refillOffers();currentTab='shop';devPanelOpen=false;mutate();return true;
 }
 throw Error('Unknown development action: '+action);
}

function residentLevelStories(level){
 const all=[];
 for(const r of RESIDENTS){
  const chapters=[
   {level:r.level,done:!!state.eventsDone[r.id]},
   {level:RESIDENT_FOLLOWUPS[r.id].level,done:!!state.residentChapters[r.id]},
   {level:RESIDENT_FINALES[r.id].level,done:!!state.residentFinals[r.id]},
   ...RESIDENT_SIDE_STORIES[r.id].map((s,i)=>({level:s.level,done:!!state.residentSideStories[r.id+'_'+i]}))
  ];
  for(const c of chapters)if(c.level===level)all.push(c.done);
 }
 return {total:all.length,finished:all.filter(Boolean).length};
}

function townAction(action,id){
 if(action==='focus-growth'){
  currentTab=id==='town'?'shrine':'shop';render();
  const target=app.querySelector(id==='town'?'#offering-target':'#growth-guide');
  target?.scrollIntoView({block:'nearest',behavior:'auto'});
  return true;
 }
 if(action==='reveal-dismiss'){cancelEvolution();sceneReveal=null;render();return true;}
 if(action==='language'){state.locale=id==='en'?'en':'ja';persist();render();return true;}
 if(action==='story-done'){state.storySeen=true;mutate();notify(L('修理屋、開店！','The repair shop is open!'),'good');return true;}
 if(action==='house-up'){const cost=houseCost();if(state.houseLevel>=4||state.coins<cost)return true;const from=state.houseLevel;state.coins-=cost;state.spent+=cost;state.houseLevel++;beginEvolution('house',from,state.houseLevel);mutate();return true;}
 if(action==='offer-town'){
  const price=townCost();if(!price||state.coins<price||state.completed<1)return true;
  const from=state.townLevel;state.coins-=price;state.spent+=price;state.townLevel++;beginEvolution('town',from,state.townLevel);
  state.offers=[];refillOffers();currentTab='shrine';mutate();return true;
 }
 if(action==='fund-project'){
  const p=CITY_PROJECTS.find(x=>x.id===id);
  if(!p||state.townLevel<p.level||state.coins<p.cost||state.projects?.[p.id])return true;
  state.coins-=p.cost;state.spent+=p.cost;state.projects[p.id]=true;
  state.tools[p.tool]=(state.tools[p.tool]||0)+p.amount;
  state.pendingScene={type:'project-result',name:p.name,icon:p.icon,amount:p.amount,tool:p.tool};
  mutate();return true;
 }
 if(action==='talk'){
  const r=RESIDENTS.find(x=>x.id===id);if(!r||!characterAvailable(r))return true;
  const key=state.completed+state.townLevel*100;if(state.residentSeen[id]===key)return true;
  state.residentSeen[id]=key;state.residentLove[id]=Math.min(5,(state.residentLove[id]||0)+1);
  const count=state.residentTalkCount[id]||0;
  const dialogue=residentText(r.lines[count%r.lines.length]);
  state.residentTalkCount[id]=count+1;
  state.pendingScene={type:'conversation',residentId:id,dialogue};mutate();return true;
 }
 if(['resident-event','resident-followup','resident-finale','resident-side-1','resident-side-2'].includes(action)){
  const config=RESIDENT_EVENTS[id],resident=RESIDENTS.find(r=>r.id===id);
  const chapter=action==='resident-finale'?3:action==='resident-followup'?2:action==='resident-side-1'?4:action==='resident-side-2'?5:1;
  if(!config||!resident||!characterAvailable(resident)||state.active)return true;
  if(chapter===1&&(state.eventsDone[id]||(id==='gen'&&state.completed<1)))return true;
  if(chapter===2&&!residentFollowupAvailable(resident))return true;
  if(chapter===3&&!residentFinalAvailable(resident))return true;
  if(chapter>=4&&!residentSideAvailable(resident,chapter))return true;
  state.pendingScene={type:'resident-intro',residentId:id,chapter};
  mutate();return true;
 }
 return false;
}

function finishTutorialCountdown(){
 if(tutorialTimer){clearInterval(tutorialTimer);tutorialTimer=null;}
 tutorialCount=null;
 const a=state.active,t=taskOf();
 if(!a?.tutorialPending||!t)return;
 const remaining=a.tutorialHoldMs;
 if(!Number.isFinite(remaining)||remaining<=0)throw Error('Tutorial time budget missing');
 state.tutorialSeen[t.type]=true;
 a.tutorialPending=false;a.tutorialHoldMs=null;
 if(a.isTimed){a.awaitingStart=false;a.awaitingStage=false;a.deadline=Date.now()+remaining;}
 else {a.normalDeadline=Date.now()+remaining;}
 if(t.type==='laser')a.stageState.epoch=Date.now();
 mutate();
}
function beginTutorialCountdown(){
 if(tutorialTimer||!state.active?.tutorialPending||state.pendingScene)return;
 tutorialCount=3;render();
 tutorialTimer=setInterval(()=>{
  if(!state.active?.tutorialPending){clearInterval(tutorialTimer);tutorialTimer=null;tutorialCount=null;return;}
  tutorialCount--;
  if(tutorialCount<=0){finishTutorialCountdown();return;}
  const label=app.querySelector('.stage-tutorial-count');
  if(label)label.textContent=String(tutorialCount);
 },750);
}
function reopenStageTutorial(){

  st.selected=part;st.rotation=initialAssemblyOrientation(t.seed,order.indexOf(part),part,a.difficulty);mutate();return;
 }
 if(action==='assemble-rotate'){
  const a=state.active,t=taskOf();if(!a||t?.type!=='assemble'||a.stageState.selected<0||a.difficulty<=2)return;
  a.stageState.rotation=(a.stageState.rotation+1)%4;mutate();return;
 }
 if(action==='assemble-socket'){
  const a=state.active,t=taskOf();if(!a||t?.type!=='assemble')return;
  const st=a.stageState,slot=Number(id),order=assemblyOrder(t.seed,a.difficulty);
  if(!Number.isInteger(slot)||slot<0||slot>=order.length||st.placed.includes(slot)||st.selected<0)return;
  if(st.selected===order[slot]&&st.rotation===assemblyOrientation(t.seed,slot,a.difficulty)){
   st.placed.push(slot);st.selected=-1;st.rotation=0;
   if(st.placed.length===order.length)finishStep();else mutate();
  }else{
   st.selected=-1;st.rotation=0;damage();
  }
  return;
 }
 if(action==='power-toggle'){
 const a=state.active,t=taskOf();if(!a||!t||t.type!=='power')return;
 const idx=Number(id),weights=powerWeights(a.difficulty);if(!Number.isInteger(idx)||idx<0||idx>=weights.length)return;
 const enabled=a.stageState.enabled;const old=enabled.indexOf(idx);if(old>=0)enabled.splice(old,1);else enabled.push(idx);mutate();return;
 }
 if(action==='power-test'){
 const a=state.active,t=taskOf();if(!a||!t||t.type!=='power')return;
 const voltage=powerWeights(a.difficulty).reduce((v,w,i)=>v+(a.stageState.enabled.includes(i)?w:0),0);
 if(voltage===powerTarget(t.seed,a.difficulty))finishStep();else damage();
 return;
 }
 if(action==='time-stop'){const a=state.active,t=taskOf();if(!a||!t||t.type!=='calibrate')return;const center=25+(t.seed%51),width=clamp(24-a.difficulty*3,6,21);const reading=calibratePressTiming===null?lastTiming:calibratePressTiming;calibratePressTiming=null;if(Math.abs(reading-center)<=width/2+2)finishStep();else damage();return;}
 if(action==='buy-tool'){const tool=TOOLS.find(x=>x.id===id);if(!tool)return;if((TOOL_UNLOCK[id]||1)>state.townLevel)return;const price=toolPrice(tool);if(state.coins<price)return notify('お金が足りません','error');state.coins-=price;state.spent+=price;state.tools[id]++;mutate();notify(`${tool.name} を $${n(price)} で購入した！`,'good');return;}
 if(action==='use-tool'){const a=state.active,t=taskOf(),tool=TOOLS.find(x=>x.id===id);if(!a||!t||!tool||!state.tools[id]||a.complete||a.broken)return;
 if(a.isTimed)return notify(L('スピード修理では補助アイテムは使えません','No assistance items in speedrun contracts'),'error');
 if(tool.stage&&tool.stage!==t.type)return; if(id==='shield'){if(a.shield)return;state.tools.shield--;a.shield=true;mutate();notify('🛡️ 次の失敗を1回防ぎます','good');return;}
 state.tools[id]--;
 if(id==='auto'){
  a.stageIndex=a.stages.length;
  if(a.residentId){finishResident(true);return;}
  a.complete=true;a.quality=repairQuality(a);
  state.pendingScene={type:'repair-complete',quality:a.quality,product:a.name,perfect:a.integrity===100,tests:a.stages.map(x=>x.type)};
  mutate();return;
 }
 finishStep(true);return;
 }
 if(action==='sell'){const a=state.active;if(!a?.complete)return;const price=saleValue(a);state.coins+=price;state.revenue+=price;state.fame+=3+a.difficulty*3+(a.integrity===100?5:0);state.completed++;state.active=null;maybeSpawnRush();mutate();notify(`${a.name} を $${n(price)} で販売！`,'good');return;}
 if(action==='collect'){const a=state.active;if(!a?.complete||a.isContract)return;const points=Math.round((11+a.difficulty*15)*[1,1.5,1.7,1.85][upgradeLevel('showcase')]);a.quality=repairQuality(a);state.collection.push(a);state.fame+=points;state.completed++;state.active=null;maybeSpawnRush();mutate();notify(`🏆 コレクション追加！ 評判 +${points}`,'good');return;}
 if(action==='scrap'){const a=state.active;if(!a)return;if(a.isTimed){finishTimed(false);return;}if(a.residentId){if(confirm(L('住人の修理依頼を中止しますか？','Abandon this resident request?')))finishResident(false);return;}const salvage=a.isContract?0:(a.broken?Math.round(a.baseValue*.11):Math.round(a.purchasePrice*.24));if(!a.broken&&!confirm(`修理をやめて $${n(salvage)} で処分しますか？`))return;state.coins+=salvage;state.revenue+=salvage;state.active=null;mutate();notify(`部品を回収して $${n(salvage)} を得た`);return;}
 if(action==='upgrade'){const up=UPGRADES.find(x=>x.id===id);if(!up||!upgradeUnlocked(up))return;const price=upgradeCost(up);if(!price||state.coins<price)return;state.coins-=price;state.spent+=price;state.upgrades[id]=upgradeLevel(id)+1;mutate();notify(`${up.name} LV.${state.upgrades[id]} に強化した！`,'good');return;}
}
// Dismiss the prior notice immediately on any new touch or click, while
// preserving the actual interaction. Newly generated notices are unaffected.
document.addEventListener('pointerdown',dismissToast,{capture:true});
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'||e.key===' ')dismissToast();
},{capture:true});
// A mobile tap should be judged at touch-down, before click delivery latency.
app.addEventListener('pointerdown',e=>{
 if(e.target.closest('[data-action="time-stop"]'))calibratePressTiming=lastTiming;
},{capture:true});
app.addEventListener('click',e=>{const c=e.target.closest('[data-action]');if(!c||c.disabled)return;handleAction(c.dataset.action,c.dataset.id);});
app.addEventListener('keydown',e=>{const c=e.target.closest('.town-hotspot[data-action]');if(!c||!(e.key==='Enter'||e.key===' '))return;e.preventDefault();handleAction(c.dataset.action,c.dataset.id);});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&currentTab==='work'&&taskOf()?.type==='calibrate'&&!e.repeat){e.preventDefault();handleAction('time-stop');}});
// Development-only diagnostic: sample actual game generation and sale formulas.
// No production save is read or modified; restore the active dev state after calculation.
if(DEV_MODE){
 window.__ffmBalance={
 sample(town,completed,count=600){
  if(!Number.isInteger(town)||town<1||town>MAX_TOWN_LEVEL||!Number.isInteger(completed)||completed<0||!Number.isInteger(count)||count<1||count>5000)throw Error('Invalid sample arguments');
  const previous=state;
  try {
   state={...baseSave(),townLevel:town,completed,houseLevel:4,nextId:1};
   const offers=Array.from({length:count},()=>generateOffer());
   const sample=offers.map(o=>{
    const pristine={...o,integrity:100};
    const dmg=11+o.difficulty*3;
    const once={...o,integrity:100-dmg};
    return {kind:o.kind,difficulty:o.difficulty,stages:o.stages.length,price:marketPrice(o),
      resale:saleValue(pristine),resaleOneMiss:saleValue(once),fee:o.price,
      normalProfit:saleValue(pristine)-marketPrice(o),oneMissProfit:saleValue(once)-marketPrice(o)};
   });
   const average=k=>Math.round(100*sample.reduce((v,x)=>v+x[k],0)/sample.length)/100;
   return {town,completed,count,tier:tier(),townCost:townCost(),houseCost:houseCost(),
    averagePrice:average('price'),averageResale:average('resale'),averageProfit:average('normalProfit'),
    averageOneMissProfit:average('oneMissProfit'),averageStages:average('stages'),
    bestProfit:Math.max(...sample.map(x=>x.normalProfit)),worstProfit:Math.min(...sample.map(x=>x.normalProfit)),
    difficultyDistribution:[1,2,3,4,5].map(d=>sample.filter(x=>x.difficulty===d).length),
    kinds:[...new Set(sample.map(x=>x.kind))].sort(),
    averageJobsToNextTown:townCost()?Math.round(100*townCost()/average('normalProfit'))/100:0
   };
  } finally{state=previous;}
 }
 };
}
load();if(!blockedSave)render();
setInterval(()=>{
 if(blockedSave||!state?.active)return;
 if(isNormalTimed(state.active)){
  const a=state.active;
  if(!a.normalRetryNeeded){
   const remaining=normalTimeLeft(a);
   if(remaining===0){normalTimeout();return;}
   updateFocusTimer(a,remaining);
   const clock=app.querySelector('[data-normal-clock]');
   if(clock){
    const sec=Math.ceil(remaining/1000);
    clock.textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
    clock.classList.toggle('urgent',remaining<=5000);
    const bar=app.querySelector('[data-normal-bar]');
    if(bar)bar.style.width=100*remaining/(a.normalStageSeconds*1000)+'%';
   }
  }
  return;
 }
 if(!state.active.isTimed||state.active.awaitingStage||state.active.awaitingStart)return;
 const a=state.active,remaining=timeLeft(a);
 if(remaining===0){finishTimed(false);return;}
 updateFocusTimer(a,remaining);
 const clock=app.querySelector('[data-timed-clock]');
 if(clock){const sec=Math.ceil(remaining/1000);clock.textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
 const bar=app.querySelector('[data-timed-bar]');if(bar)bar.style.width=100*remaining/((a.stageSeconds||a.budget)*1000)+'%';
 clock.classList.toggle('urgent',remaining<=2000);
 }
},200);
})();
