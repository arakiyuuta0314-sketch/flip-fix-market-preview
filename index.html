/* TOWN REVIVAL • vertical slice v0.4 */
:root{--base:#112032;--panel:#21334b;--panel2:#28415d;--stroke:#435c70;--gold:#ffcf75;--mint:#88ebc7}
body{background:radial-gradient(ellipse at top,#1c4560 0,#12273b 56%,#101b2b 100%)}
.town-world{position:relative;min-height:290px;background:#9bd2df;border:5px solid #476d7b;border-radius:20px;box-shadow:0 12px 40px #0005;overflow:hidden;margin:0 0 21px;isolation:isolate}
.town-world svg{display:block;width:100%;height:260px;object-fit:cover;object-position:center}
.town-head{position:absolute;top:12px;left:14px;display:flex;align-items:center;gap:9px;z-index:4;flex-wrap:wrap}
.town-label{border-radius:13px;background:#122941dc;border:1px solid #ffffff52;color:#ffecbb;padding:8px 13px;font-weight:850;box-shadow:0 5px 15px #0003;font-size:13px;backdrop-filter:blur(8px)}
.town-label small{display:block;font-size:10px;color:#bfeadb;font-weight:700}
.town-badge{background:#fef4d9eb;color:#29435b;border-radius:10px;padding:7px 11px;font-weight:850}
.world-actions{position:absolute;z-index:5;right:13px;bottom:12px;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.world-actions .btn{box-shadow:0 4px 1px #10222b50;font-size:12px}
.world-toast{position:absolute;left:16px;bottom:16px;z-index:3;background:#173147d9;color:#fff9df;padding:7px 12px;border-radius:9px;font-weight:750;font-size:12px;max-width:62%}
.sky-cloud{animation:cloudTravel 15s ease-in-out infinite alternate;transform-origin:center}.sky-cloud:nth-of-type(even){animation-delay:-7s}@keyframes cloudTravel{from{transform:translateX(-13px)}to{transform:translateX(18px)}}
.town-person{animation:bob 1.5s ease-in-out infinite alternate;transform-origin:center bottom}@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.town-banner{background:linear-gradient(125deg,#2b4d61,#334359);border:1px solid #6d90a0;border-radius:16px;padding:20px 22px;margin-bottom:15px}
.town-banner h2{margin:3px 0 6px;font-size:26px}.town-banner p{color:#e0eaf4;margin:0;max-width:66ch}

 return `<section class="town-world ${sceneReveal?'town-cinematic fx-celebrate':''}" aria-label="${L('街の箱庭','Town diorama')}">${scenery()}<div class="town-head"><div class="town-label"><small>${L('わたしの街','MY TOWN')}</small>${getTownName()}</div><span class="town-badge">LV.${state.townLevel}/8</span></div><div class="village-stat">🏠 ${L('家','Home')} ${state.houseLevel}/4 · ⛩️ ${L('街','Town')} ${state.townLevel}/8</div><div class="world-actions"><button class="btn secondary sm" data-action="tab" data-id="shop">🏠 ${L('改装','Home')}</button><button class="btn sm" data-action="tab" data-id="shrine">⛩️ ${L('奉納','Shrine')}</button></div>${milestone}</section>`;
}
function questView(){const q=objective();return `<div class="quest"><div><b>✦ ${L('次の目標','NEXT GOAL')} · ${q.title}</b><p>${q.desc}</p></div><button class="btn sm" data-action="tab" data-id="${q.tab}">${q.label} →</button></div>`;}
function storyIntro(){return !state.storySeen?`<div class="story-cut"><b>PROLOGUE · ${L('修理屋と忘れられた村','The repairer and the forgotten town')}</b><h2>${L('ようこそ、小さな修理屋へ。','Welcome to your little workshop.')}</h2><p>${L('新しい生活を始めようと、あなたは静かな田舎町にやってきた。空き家だらけの通り、壊れた看板、誰も使わない古い神社。','You arrive in a quiet village to start a new life. Empty houses, broken signs, and a lonely old shrine line the streets.')}</p><p>${L('残っていた古道具屋の源さんが言う。「壊れたものを直せるなら、この街もきっと直せるさ」','An old antique dealer named Gen smiles: “If you can fix broken things, perhaps you can fix this town too.”')}</p><p><b>${L('修理で稼ぎ、神社に奉納して、街を未来まで育てよう。','Repair, earn, offer at the shrine, and grow the town into the future.')}</b></p><button class="btn" data-action="story-done">${L('さあ、修理屋を開店！','Open the workshop!')} →</button></div>`:'';}
function renderTownHome(){const q=objective();return `${storyIntro()}<div class="town-banner"><div class="eyebrow">TOWN REVIVAL · ${L('街を再生する物語','A town worth saving')}</div><h2>${L('壊れたものから、街を取り戻そう。','Repair things. Rebuild a town.')}</h2><p>${L('修理で稼ぎ、賽銭箱にまとまったお金を奉納。家と街並みが変わり、住人・道具・商品が増えていく。','Earn from repairs, make a big offering at the shrine, and watch houses, neighbors and new items appear.')}</p></div>${questView()}<div class="town-grid"><section class="town-panel"><h3>🏚️ ${L('あなたの修理屋','Your repair shop')}</h3><p>${L('家の状態','House condition')}: ${state.houseLevel===0?L('雨漏りするボロ家','A leaking fixer-upper'):state.houseLevel===1?L('屋根と壁を修理済み','Roof and walls repaired'):state.houseLevel===2?L('新しい作業場','Expanded workroom'):L('住み心地のいい工房','A cozy workshop')}</p><div class="progress-track"><div class="progress-fill" style="width:${state.houseLevel*25}%"></div></div><p>${L('家の修復は街の発展とは別に進められる。見た目も少しずつ良くなる。','Renovate your home separately from town progression. Watch your shop improve.')}</p><div class="scene-choice"><button class="btn secondary" data-action="house-up" ${state.houseLevel>=4||state.coins<houseCost()?'disabled':''}>🛠️ ${L('家を直す','Renovate house')} ${state.houseLevel>=4?L('完成！','MAX'):('$'+n(houseCost()))}</button><button class="btn" data-action="tab" data-id="${q.tab}">${q.label} →</button></div></section><section class="town-panel"><h3>📒 ${L('今までの成果','Your progress')}</h3><div class="price-row"><span>${L('修理完了','Repairs finished')}</span><strong>${n(state.completed)}</strong></div><div class="price-row"><span>${L('累計売上','Total revenue')}</span><strong>$${n(state.revenue)}</strong></div><div class="price-row"><span>${L('知り合った住人','Neighbors met')}</span><strong>${RESIDENTS.filter(r=>characterAvailable(r)).length}</strong></div><div class="price-row"><span>${L('街の発展','Town stage')}</span><strong>${state.townLevel}/8</strong></div><div class="scene-choice"><button class="btn secondary" data-action="tab" data-id="people">💬 ${L('住人に会う','Residents')}</button></div></section></div>`;}
function renderShrine(){const price=townCost(),next=state.townLevel+1,ready=state.coins>=price&&state.completed>0;return `${title('THE SHRINE',L('街の神社','Town shrine'),L('まとまったお金を奉納すると、街の景色が一気に変わる。','A large offering changes the whole town.'))}${questView()}<div class="town-grid"><section class="town-panel"><h3>⛩️ ${L('賽銭箱','Offering box')}</h3><p>${state.townLevel===1?L('「この街にも、もう一度にぎわいを」──源さんの願いが書かれている。','An old plaque reads: “May this town flourish again.”'):L('奉納するたびに、建物が直り、新しい住人がやってくる。','Each offering restores buildings and welcomes new neighbors.')}</p>${next<=8?`<div class="story-box"><div class="voice">${L('次の街へ','NEXT STAGE')} · LV.${next}</div><h2 style="margin:3px 0">${TOWN_NAMES[next][state.locale==='en'?1:0]}</h2><div class="price-row"><span>${L('奉納額','Offering')}</span><strong>$${n(price)}</strong></div><div class="price-row"><span>${L('所持金','Balance')}</span><strong>$${n(state.coins)}</strong></div><div class="progress-track"><div class="progress-fill" style="width:${clamp(100*state.coins/price,0,100)}%"></div></div><button class="btn block" data-action="offer-town" ${ready?'':'disabled'}>⛩️ ${L('奉納して街を発展させる','Make offering & upgrade town')} · $${n(price)}</button>${state.completed===0?`<p>${L('最初に一品修理して、街の人から信頼を得よう。','First repair an item to earn the villagers’ trust.')}</p>`:''}</div>`:`<div class="story-box"><h2>${L('未来都市が完成！','The future city is complete!')}</h2><p>${L('街の発展を見届けた。これからは住人との関係や収集を楽しもう。','Your town is thriving. Keep collecting and making memories.')}</p></div>`}</section><section class="town-panel"><h3>✨ ${L('発展で解放されるもの','What town growth unlocks')}</h3><div class="unlock-grid">${(next===2?[L('カメラと時計','Cameras & clocks'),L('ミアのカフェ','Mia’s cafe'),L('配線修理チップ','Wire repair chips')]:next===3?[L('発明家レオ','Leo the inventor'),L('ロボット','Toy robots'),L('難易度★4への挑戦','Harder repair jobs')]:next===4?[L('商店街と住人フミ','Main street & Fumi'),L('レトロゲーム機','Retro consoles'),L('回路修理キット','Circuit kits')]:[L('新しい街並み','New cityscape'),L('高度な修理品','Advanced repair items'),L('より多彩な住人イベント','More resident events')]).map(x=>`<span class="unlock-chip">✦ ${x}</span>`).join('')}</div><p>${L('街の発展で新しい品目と道具が開放。販売利益が増える一方、修理の難度も高くなる。','More items and tools unlock with each town level, along with tougher repairs.')}</p><button class="btn secondary block" data-action="tab" data-id="market">📦 ${L('仕入れ市場へ','Go to market')}</button></section></div><section class="town-panel section-block"><h3>${L('街の成長記録','Town timeline')}</h3><div class="town-stages">${TOWN_NAMES.slice(1).map((n,i)=>`<div class="town-stage ${i+1===state.townLevel?'here':i+1<state.townLevel?'done':''}"><b>LV.${i+1} ${n[state.locale==='en'?1:0]}</b><span>${i+1<state.townLevel?L('発展済み','Restored'):i+1===state.townLevel?L('いまここ','Current'):L('これから','Locked')}</span></div>`).join('')}</div></section>`;}
function renderPeople(){return `${title('TOWN STORIES',L('街の住人','Town residents'),L('街が発展するほど新しい人がやってくる。修理と会話で仲良くなろう。','Meet neighbors and build friendships as your town grows.'))}${questView()}<div class="town-grid"><section class="town-panel"><h3>💌 ${L('顔なじみとイベント','Friendships & stories')}</h3>${RESIDENTS.map(r=>{const unlocked=characterAvailable(r),love=state.residentLove[r.id]||0,canTalk=unlocked&&(state.residentSeen[r.id]||-1)!==state.completed+state.townLevel*100,evt=unlocked&&r.id==='mia'&&!state.eventsDone.mia;return `<div class="person-card" style="${!unlocked?'opacity:.42':''}"><div class="person-face">${unlocked?r.emoji:'🔒'}</div><div class="person-details"><h3>${unlocked?residentName(r):L('まだ知らない住人','Unknown neighbor')} <span class="muted" style="font-size:11px">${unlocked?residentText(r.role):'LV.'+r.level}</span></h3><div class="hearts">${'♥'.repeat(Math.min(5,love))}${'♡'.repeat(5-Math.min(5,love))}</div><p>${unlocked?residentText(r.lines[Math.min(2,Math.floor(love/2))]):L('街が育つと引っ越してくる。','Moves in when the town grows.')}</p>${unlocked?`<button class="btn sm ${canTalk?'':'secondary'}" data-action="talk" data-id="${r.id}" ${canTalk?'':'disabled'}>${canTalk?L('話しかける','Talk'):L('また次の修理後に','After next repair')}</button>${evt?` <button class="btn sm" data-action="resident-event" data-id="mia">✨ ${L('歓迎イベント','Welcome event')}</button>`:''}`:''}</div></div>`}).join('')}</section><section class="town-panel"><h3>📅 ${L('街で起こったこと','Town journal')}</h3>${state.townLevel===1?`<div class="story-box"><div class="voice">${L('新しい出会い','FIRST MEETING')}</div><p>${L('源さんは昔からこの街を見守っている。最初の修理が終わったら話しかけてみよう。','Gen has watched over this town for years. Talk to him after your first repair.')}</p></div>`:''}${Object.entries(state.eventsDone).filter(([_,v])=>v).map(([k])=>`<p>✅ ${k==='mia'?L('ミアのカフェ開店祝い','Mia’s cafe opening'):L('住人イベント','Resident event')}</p>`).join('')||`<p>${L('これから街の思い出が増えていく。','New memories are waiting.')}</p>`}<h3>${L('街を育てると','With every town upgrade')}</h3><p>${L('新しい住人が現れ、特別な会話やアイテムが開放される。全員と仲良くなる必要はない。','New neighbors bring new stories and useful rewards. Socializing is optional.')}</p><button class="btn secondary block" data-action="tab" data-id="shrine">⛩️ ${L('神社へ','Visit shrine')}</button></section></div>`;}
function townAction(action,id){
 if(action==='reveal-dismiss'){sceneReveal=null;render();return true;}
 if(action==='language'){state.locale=id==='en'?'en':'ja';persist();render();return true;}
 if(action==='story-done'){state.storySeen=true;mutate();notify(L('修理屋、開店！','The repair shop is open!'),'good');return true;}
 if(action==='house-up'){const cost=houseCost();if(state.houseLevel>=4||state.coins<cost)return true;const from=state.houseLevel;state.coins-=cost;state.spent+=cost;state.houseLevel++;sceneReveal={kind:'house',from,to:state.houseLevel};mutate();notify(L('家がきれいになった！','Your house looks better!'),'good');return true;}
 if(action==='offer-town'){
  const price=townCost();if(!price||state.coins<price||state.completed<1)return true;
  const from=state.townLevel;state.coins-=price;state.spent+=price;state.townLevel++;state.houseLevel=Math.max(state.houseLevel,1);sceneReveal={kind:'town',from,to:state.townLevel};
  state.offers=[];refillOffers();currentTab='shrine';mutate();notify(L('街が進化した！新しい商品と住人が登場！','Town upgraded! New items and residents unlocked!'),'good');return true;
 }
 if(action==='talk'){const r=RESIDENTS.find(x=>x.id===id);if(!r||!characterAvailable(r))return true;const key=state.completed+state.townLevel*100;if(state.residentSeen[id]===key)return true;state.residentSeen[id]=key;state.residentLove[id]=Math.min(5,(state.residentLove[id]||0)+1);mutate();notify(residentName(r)+': '+residentText(r.lines[Math.min(2,Math.floor((state.residentLove[id]-1)/2))]),'good');return true;}
 if(action==='resident-event'&&id==='mia'&&state.townLevel>=2&&!state.eventsDone.mia){state.eventsDone.mia=true;state.residentLove.mia=Math.min(5,(state.residentLove.mia||0)+2);state.tools.shield+=2;mutate();notify(L('ミアのカフェ開店！ お礼に保護フィルムを2枚もらった。','Mia’s cafe is open! You received 2 protective films.'),'good');return true;}
 return false;
}

};
function translateDOM(){if(state.locale!=='en')return;const walk=document.createTreeWalker(app,NodeFilter.SHOW_TEXT);const nodes=[];while(walk.nextNode())nodes.push(walk.currentNode);for(const node of nodes){let txt=node.nodeValue;for(const [ja,en] of Object.entries(TRANSLATIONS)){if(ja&&txt.includes(ja))txt=txt.split(ja).join(en);}node.nodeValue=txt;}}

function navButton(id,icon,text){return `<button class="navbtn ${currentTab===id?'active':''}" data-action="tab" data-id="${id}"><span class="symbol">${icon}</span><span>${text}</span></button>`;}
function money(){return `<span class="circle-icon">$</span><b>${n(state.coins)}</b>`;}
function currentLevel(){return `Lv.${tier()}`;}
function render(){if(blockedSave)return;document.documentElement.lang=state.locale;cancelAnimationFrame(timingRaf);app.innerHTML=`<div class="shell">
 <header class="topbar"><div class="identity"><div class="logo-icon">🔧</div><div><h1>FLIP & FIX</h1><p>Repair • Trade • Collect</p></div></div><div class="top-right"><div class="language-switch"><button data-action="language" data-id="ja" class="${state.locale==='ja'?'selected':''}">日本語</button><button data-action="language" data-id="en" class="${state.locale==='en'?'selected':''}">EN</button></div><div class="level-tag">⭐ <b>${currentLevel()}</b></div><div class="money">${money()}</div><div class="status-pill" id="save-state">${storageAvailable?'● オートセーブ済み':'⚠ 保存不可・体験のみ'}</div></div></header>
 ${world()}<div class="layout"><aside class="sidebar">${navButton('shop','🏠','マイショップ')}${navButton('market','📦','仕入れ市場')}${navButton('work','🔧','修理工房')}${navButton('tools','🛒','アイテムショップ')}${navButton('gallery','🏆','コレクション')}${navButton('shrine','⛩️','神社')}${navButton('people','💬','住人')}<div class="side-separator"></div><div class="sidebar-foot"><h3>SHOP LOG</h3><p>修理完了：${n(state.completed)} 個<br>修理ミス：${n(state.failures)} 回<br>累計売上：$${n(state.revenue)}<br>評判：${n(state.fame)} pt</p><button class="btn secondary sm block" data-action="reset">最初からやり直す</button></div></aside>
 <main class="content">${renderTab()}</main></div>
 <nav class="mobile-nav" aria-label="ゲームメニュー">${navButton('shop','🏠','お店')}${navButton('market','📦','仕入れ')}${navButton('work','🔧','修理')}${navButton('tools','🛒','道具')}${navButton('people','💬','住人')}</nav>
 <div class="footer">TOWN REVIVAL · FIRST 10 MINUTES v0.5 • ${storageAvailable?'保存先：このブラウザ内':'この環境は保存不可（画面を閉じるとリセット）'} • ゲーム内通貨のみ / 実際の課金はありません</div>
 </div>`;
 translateDOM();
 if(state.seenCelebration<state.townLevel){state.seenCelebration=state.townLevel;persist();}
 if(currentTab==='work'&&taskOf()?.type==='calibrate')startCalibration();
 if(currentTab==='work'&&taskOf()?.type==='clean')bindCleaning();
}
function title(eyebrow,head,sub='',extra=''){return `<div class="section-heading"><div><div class="eyebrow">${eyebrow}</div><h2>${head}</h2>${sub?`<p class="sub">${sub}</p>`:''}</div>${extra}</div>`;}
function renderTab(){switch(currentTab){case 'shop':return renderShop();case 'market':return renderMarket();case 'work':return renderWork();case 'tools':return renderTools();case 'gallery':return renderGallery();case 'shrine':return renderShrine();case 'people':return renderPeople();default:return '';}}
function renderShop(){return renderTownHome();}
function itemCard(o,context='market'){
 const p=marketPrice(o);
 return `<article class="item-card"><div class="row between"><span class="tag ${o.rarity==='LEGENDARY'?'legend':o.rarity==='EPIC'?'epic':o.rarity==='RARE'?'rare':''}">${o.rarity}</span><span class="stars">${stars(o.difficulty)}</span></div><div class="art-frame">${renderObjectSvg(o)}</div><div><h3 class="item-name">${o.name}</h3><p class="item-sub">難易度 ${o.difficulty}/5 • ${o.stages.length} 工程</p></div><div class="card-meta"><span class="price">$${n(context==='market'?p:o.price)}</span><span class="pill">予想完売値 $${n(Math.round(o.baseValue*.98))}</span></div>${context==='market'?`<button class="btn block" data-action="buy" data-id="${o.id}" ${state.coins<p||state.inventory.length+(state.active?1:0)>=limit()?'disabled':''}>仕入れる</button>`:`<button class="btn block" data-action="activate" data-id="${o.id}" ${state.active?'disabled':''}>修理台に置く</button>`}</article>`;
}
function renderMarket(){return `${title('DISCOVER & TRADE','仕入れ市場','価値がありそうなジャンク品を見つけよう。仕入れには資金が必要。',`<button class="btn secondary sm" data-action="refresh">🔄 品ぞろえ更新 $25</button>`)}
 ${questView()}<div class="unlock-notice">🔓 ${L('街レベル','Town level')} ${state.townLevel}: ${L('仕入れ可能な品目が街の成長に合わせて増えます。','More product types unlock as your town grows.')}</div><div class="cards-grid">${state.offers.map(o=>itemCard(o)).join('')}</div>
 <div class="section-block hint">💡 高額商品ほど修理が難しく、失敗時の損失も大きい。最初は★1から始めるのがおすすめ。保管枠 ${state.inventory.length+(state.active?1:0)}/${limit()}。</div>
 ${!state.active&&!state.inventory.length&&state.coins<Math.min(...state.offers.map(x=>marketPrice(x)))?`<section class="panel padded section-block"><h3>🧰 お客さんからの小口修理</h3><p class="sub">仕入れ資金が足りなくても、お客さんの商品を無料で預かって修理できます。</p><button class="btn section-block" data-action="contract">無料の修理依頼を受ける</button></section>`:''}
 ${state.inventory.length?`<section class="panel padded section-block"><div class="main-card-title"><h3>📦 保管中の商品</h3><button class="btn ghost sm" data-action="tab" data-id="work">修理へ →</button></div><div class="row" style="flex-wrap:wrap">${state.inventory.map(x=>`<span class="pill">${x.name} ${stars(x.difficulty)}</span>`).join('')}</div></section>`:''}`;}
function renderWork(){const a=state.active;return `${title('FIX IT UP','修理工房','ひとつずつ工程をクリアして、商品をよみがえらせよう。')}${a?activeWorkbench(a):renderInventory()}`;}
function renderInventory(){if(!state.inventory.length)return `<div class="empty"><div class="big-emoji">🛠️</div><h3>作業台は空っぽ</h3><p>市場で商品を仕入れたら、ここで修理に挑戦しよう。失敗すると耐久度が下がるので注意！</p><button class="btn" data-action="tab" data-id="market">📦 商品を仕入れる</button>${state.coins<Math.min(...state.offers.map(marketPrice))?'<div class="section-block"><p class="sub">資金が尽きても復帰できるよう、無料の小口修理依頼を受けられます。</p><button class="btn ghost" data-action="contract">🧰 小口修理の仕事を受ける（無料）</button></div>':''}</div>`;return `<div class="cards-grid">${state.inventory.map(x=>itemCard(x,'inventory')).join('')}</div>`;}
function activeWorkbench(a){
 const progress=a.stageIndex/a.stages.length;
 let stageArea;
 if(a.broken) stageArea=`<div class="result-card"><h3>💥 修理不能になった…</h3><p>本体が損傷してしまった。少しだけ部品代を回収できる。</p><div class="total">$${n(Math.round(a.baseValue*.11))}</div><button class="btn danger block" data-action="scrap">ジャンク品として処分</button></div>`;
 else if(a.complete)stageArea=`<div class="result-card"><div class="eyebrow">REPAIR COMPLETE</div><h3>✨ ${a.name} 復活！</h3><p class="sub">修復品質 ${repairQuality(a)}% • 仕入れ価格 $${n(a.purchasePrice)}</p><div class="total">$${n(saleValue(a))}</div><p class="sub">仕入れ差額：$${n(saleValue(a)-a.purchasePrice)}（消耗品代は別）</p><p class="sub">販売すれば資金を獲得。展示すれば評判が上がり、より難しい商品が出現。</p><div class="inline-actions section-block"><button class="btn" data-action="sell">💰 この価格で売る</button>${a.isContract?'':`<button class="btn secondary" data-action="collect">🏆 展示する</button>`}</div></div>`;
 else stageArea=renderMinigame(a);
 return `<div class="workshop-grid"><section class="panel padded"><div class="row between"><div><span class="tag ${a.rarity==='LEGENDARY'?'legend':''}">${a.rarity}</span><h3 style="margin:5px 0 0;font-size:19px">${a.name}</h3></div><div class="stars">${stars(a.difficulty)}</div></div><div class="art-frame large" style="margin-top:13px">${renderObjectSvg(a)}</div><div class="statline"><span class="muted">本体の耐久度（ミスで減少）</span><b>${a.integrity}% ${a.shield?'🛡️':''}</b></div><div class="condition-track"><span style="width:${a.integrity}%"></span></div><div class="statline"><span class="muted">修理の進捗</span><b>${a.stageIndex}/${a.stages.length} 工程</b></div><div class="step-progress">${a.stages.map((s,i)=>`<span class="${i<a.stageIndex?'done':i===a.stageIndex?'current':''}" title="${STAGES[s.type].name}"></span>`).join('')}</div><div class="row between"><span class="muted tiny">購入価格：$${n(a.purchasePrice)}</span>${a.broken||a.complete?'':'<button class="btn danger sm" data-action="scrap">途中で諦める</button>'}</div></section>
 <section class="panel workshop-controls">${stageArea}${!a.complete&&!a.broken?`<div class="section-block"><div class="main-card-title"><h3>🧰 使い切りアイテム</h3><button class="btn ghost sm" data-action="tab" data-id="tools">買い足す →</button></div><div class="tools-grid">${TOOLS.map(tool=>`<button class="tool-btn" data-action="use-tool" data-id="${tool.id}" ${state.tools[tool.id]===0 || (tool.stage && tool.stage!==taskOf()?.type) || (tool.id==='shield'&&a.shield)?'disabled':''}>${tool.icon} ${tool.name}<small>所持 ${state.tools[tool.id]} 個${tool.id==='shield'&&a.shield?' • 使用中':''}</small></button>`).join('')}</div></div>`:''}</section></div>
 ${state.inventory.length?`<section class="panel padded section-block"><div class="main-card-title"><h3>📦 倉庫の在庫（${state.inventory.length}個）</h3><span class="muted tiny">いまの修理を終えたら次の商品へ</span></div><div class="row" style="flex-wrap:wrap">${state.inventory.map(x=>`<span class="pill">${x.name} ${stars(x.difficulty)}</span>`).join('')}</div></section>`:''}`;
}
function cleanLocations(count,seed){const pos=[];let x=seed>>>0;for(let i=0;i<count;i++){x=(1664525*x+1013904223)>>>0;const xp=19+(x%63);x=(1664525*x+1013904223)>>>0;const yp=22+(x%55);pos.push([xp,yp]);}return pos;}
function renderMinigame(a){const t=taskOf(),st=a.stageState||{},def=STAGES[t.type];let inside='';
 if(t.type==='clean'){const coords=cleanLocations(st.count,t.seed);inside=`<div class="clean-pad" id="clean-pad" aria-label="汚れをなぞって落とす">${coords.map(([x,y],i)=>`<span class="clean-spot ${(st.cleaned||[]).includes(i)?'is-clean':''}" data-spot="${i}" style="left:${x}%;top:${y}%"></span>`).join('')}</div><p class="game-tip">${(st.cleaned||[]).length}/${st.count} 個の汚れを除去 • マウス/指でなぞる</p>`;}
 if(t.type==='wires'){const count=st.count,order=shuffleIndex(count,t.seed);let paths='';for(let i=0;i<count;i++)if(st.done.includes(i)){const y1=(15+ i*(145/(count-1)) +18),k=order.indexOf(i),y2=(15+k*(145/(count-1))+18);paths+=`<path d="M55 ${y1} C130 ${y1},125 ${y2},${290} ${y2}" stroke="${COLORS[i]}" stroke-width="5" fill="none" stroke-linecap="round" opacity=".85"/>`;}
 inside=`<div class="wire-pad"><svg viewBox="0 0 344 176" preserveAspectRatio="none" class="wire-lines">${paths}</svg><div class="terminal-col">${Array.from({length:count},(_,i)=>`<button class="terminal ${selectedWire===i?'selected':''} ${st.done.includes(i)?'done':''}" style="background:${COLORS[i]}" data-action="wire-start" data-id="${i}" ${st.done.includes(i)?'disabled':''} aria-label="左の${i+1}番の端子"></button>`).join('')}</div><div class="terminal-col">${order.map((val,i)=>`<button class="terminal ${st.done.includes(val)?'done':''}" style="background:${COLORS[val]}" data-action="wire-end" data-id="${val}" ${st.done.includes(val)?'disabled':''} aria-label="右の${i+1}番の端子"></button>`).join('')}</div></div><p class="game-tip">${st.done.length}/${count} 本接続 • 間違った組み合わせはダメージ</p>`;
 }
 if(t.type==='screws'){const seq=shuffleIndex(st.count,t.seed);const visible=!st.started||a.difficulty<=2;inside=`<div class="screw-panel"><div class="screw-sequence">${visible?'外す順番：'+seq.map(i=>i+1).join(' → '):'順番は非表示です。記憶した順番で外そう！'}</div>${!st.started?`<button class="btn block" data-action="screw-start">🪛 覚えた！ 分解開始</button>`:`<div class="screw-grid">${Array.from({length:st.count},(_,i)=>`<button class="screw-head ${st.removed.includes(i)?'removed':''}" data-action="screw-turn" data-id="${i}" ${st.removed.includes(i)?'disabled':''} aria-label="ネジ ${i+1}">${i+1}<small>✕</small></button>`).join('')}</div>`}</div><p class="game-tip">${st.removed.length}/${st.count} 本分解 • 間違えると本体を傷つけます</p>`;}
 if(t.type==='circuit'){const path=circuitPath(a.difficulty);const aMap=new Map(path.map((v,i)=>[v,i]));inside=`<div class="circuit-panel"><div class="circuit-labels"><b>⚡ INPUT</b><span>タップで90°回転</span><b>OUTPUT ⚡</b></div><div class="circuit-grid">${Array.from({length:9},(_,slot)=>{const i=aMap.get(slot);if(i===undefined)return '<div class="circuit-empty"></div>';const dir=circuitConnectors(path,i),angle=st.angles[i];return `<button class="circuit-tile" data-action="circuit-turn" data-id="${i}" aria-label="回路パネル ${i+1} を回転"><svg viewBox="0 0 100 100" aria-hidden="true"><g transform="rotate(${angle*90},50,50)"><circle cx="50" cy="50" r="15" fill="#fed58f"/>${dir.map(d=>{const e=[[50,0],[100,50],[50,100],[0,50]][d];return `<path d="M50 50 L${e[0]} ${e[1]}" stroke="#94efcc" stroke-width="13" stroke-linecap="round"/>`;}).join('')}</g></svg></button>`;}).join('')}</div></div><p class="game-tip">緑の配線が入口と出口をつなぐように回転。すべて通れば成功！</p>`;}
 if(t.type==='calibrate'){const center=25+(t.seed%51),width=clamp(24-a.difficulty*3,6,21);inside=`<div class="calibration-pad"><div class="row between"><span class="muted tiny">MIN</span><b style="color:var(--mint)">SWEET SPOT</b><span class="muted tiny">MAX</span></div><div class="slider-rail"><div class="slider-target" style="left:${center-width/2}%;width:${width}%"></div><div class="slider-needle" id="needle" style="left:50%"></div></div><button class="btn block" data-action="time-stop">🎯 ここで止める！ (Space)</button></div><p class="game-tip">針が緑の範囲にある時だけ成功。精密操作ほど範囲が狭い。</p>`;}
 return `<div class="eyebrow">REPAIR TASK ${a.stageIndex+1} / ${a.stages.length}</div><div class="minigame"><h3>${def.icon} ${def.name}</h3><p>${def.tip}</p>${inside}</div><div class="hint section-block">⚠️ 修理ミスで本体耐久度が減少。残り12%以下になると修復不能。保護フィルムは次のミスを1回防ぎます。</div>`;
}
function renderTools(){return `${title('TOOLS & UPGRADES','アイテムショップ','ゲーム内のお金を使って、修理の効率を上げたりお店を育てよう。')}
 <div class="unlock-notice">⛩️ ${L('街が発展すると新しい道具が解放されます。','Develop your town to unlock more tools.')}</div><div class="eyebrow section-block">CONSUMABLES · 使い切りアイテム</div><div class="stack">${TOOLS.filter(x=>({clean:1,shield:1,wire:2,screw:2,precision:3,circuit:4,auto:3}[x.id]||1)<=state.townLevel).map(x=>`<div class="shop-item"><div class="shop-icon">${x.icon}</div><div class="shop-desc"><h3>${x.name} <span class="pill">所持 ${state.tools[x.id]}</span></h3><p>${x.desc}</p></div><div class="shop-price">$${n(x.cost)}</div><button class="btn sm" data-action="buy-tool" data-id="${x.id}" ${state.coins<x.cost?'disabled':''}>購入</button></div>`).join('')}</div>
 <div class="eyebrow section-block" style="margin-top:25px">PERMANENT · 永続アップグレード</div><div class="upgrade-grid">${UPGRADES.map(x=>`<div class="shop-item"><div class="shop-icon">${x.icon}</div><div class="shop-desc"><h3>${x.name}</h3><p>${x.desc}</p><span class="shop-price">$${n(x.cost)}</span></div><button class="btn sm ${state.upgrades[x.id]?'secondary':''}" data-action="upgrade" data-id="${x.id}" ${state.upgrades[x.id]||state.coins<x.cost?'disabled':''}>${state.upgrades[x.id]?'購入済':'購入'}</button></div>`).join('')}</div><div class="hint section-block">💡 消耗品で手間と失敗リスクを減らせる一方、購入費用が利益を圧迫することも。何に投資するかが経営のポイント。</div>`;}
function renderGallery(){return `${title('THE COLLECTION','コレクション','売らずに残した特別な修理品。展示すると評判が上がる。')}${state.collection.length?`<div class="cards-grid">${state.collection.map(x=>`<div class="gallery-card"><span class="tag ${x.rarity==='LEGENDARY'?'legend':''}">${x.rarity}</span><div class="art-frame" style="margin-top:8px">${renderObjectSvg(x)}</div><h3 class="item-name">${x.name}</h3><p class="item-sub">修復品質 ${x.quality}% • 難易度 ${stars(x.difficulty)}</p></div>`).join('')}</div>`:`<div class="empty"><div class="big-emoji">🏆</div><h3>まだ展示品がありません</h3><p>商品を修理したら、販売せずに「展示する」を選べます。貴重な品を集めて、伝説のお店を目指そう。</p><button class="btn" data-action="tab" data-id="market">📦 市場で探す</button></div>`}
 <section class="panel padded section-block"><div class="row between"><h3 style="margin:0">🌟 展示特典</h3><b class="light">評判 ${state.fame} pt</b></div><p class="sub">現在の仕入れ市場ティア ${tier()}/5。修理品を売っても少し評判が増え、展示すると多く増える。</p></section>`;}
function bindCleaning(){const pad=document.getElementById('clean-pad');if(!pad)return;
 const hit=(event)=>{const a=state.active,t=taskOf();if(!a||!t||t.type!=='clean')return;const r=pad.getBoundingClientRect();if(r.width===0)return;const x=(event.clientX-r.left)/r.width*100,y=(event.clientY-r.top)/r.height*100;const spots=cleanLocations(a.stageState.count,t.seed);
 let changed=false;for(let i=0;i<spots.length;i++){const [sx,sy]=spots[i];if(Math.abs((x-sx)*r.width/100)<30&&Math.abs((y-sy)*r.height/100)<26&&!a.stageState.cleaned.includes(i)){a.stageState.cleaned.push(i);const el=pad.querySelector(`[data-spot="${i}"]`);if(el)el.classList.add('is-clean');changed=true;}}
 if(changed){persist();const label=pad.parentElement?.querySelector('.game-tip');if(label)label.textContent=`${a.stageState.cleaned.length}/${a.stageState.count} 個の汚れを除去 • マウス/指でなぞる`;if(a.stageState.cleaned.length===a.stageState.count){dragging=false;finishStep();}}
 };
 pad.addEventListener('pointerdown',e=>{dragging=true;pad.setPointerCapture?.(e.pointerId);hit(e);});pad.addEventListener('pointermove',e=>{if(dragging)hit(e)});pad.addEventListener('pointerup',()=>dragging=false);pad.addEventListener('pointercancel',()=>dragging=false);
}
function startCalibration(){const task=taskOf();if(!task)return;const needle=document.getElementById('needle');if(!needle)return;let start=performance.now();let seed=task.seed;const speed=.0018+state.active.difficulty*.00055;function draw(time){lastTiming=50+47*Math.sin((time-start)*speed+seed%11);needle.style.left=lastTiming+'%';timingRaf=requestAnimationFrame(draw);}timingRaf=requestAnimationFrame(draw);}
function activate(id){if(state.active)return notify('先に作業台の修理を終えてください。','error');const ix=state.inventory.findIndex(x=>x.id===id);if(ix<0)return;const a=state.inventory.splice(ix,1)[0];a.stageIndex=0;a.integrity=100;a.complete=false;a.broken=false;a.shield=false;state.active=a;initStage();currentTab='work';mutate();}
function resetAll(){if(confirm('すべての進行状況を削除してニューゲームを始めますか？この操作は取り消せません。')){state=baseSave();refillOffers();currentTab='shop';mutate();notify('新しいお店をオープン！','good');}}
function handleAction(action,id){
 if(townAction(action,id))return;
 if(action==='tab'){currentTab=id;selectedWire=-1;render();return;}
 if(action==='reset'){resetAll();return;}
 if(action==='refresh'){if(state.coins<25)return notify('お金が足りません','error');state.coins-=25;state.spent+=25;state.offers=[];refillOffers();mutate();notify('新しい商品が入荷！');return;}
 if(action==='buy'){
 const ix=state.offers.findIndex(x=>String(x.id)===String(id));if(ix<0)return;const offer=state.offers[ix],price=marketPrice(offer);
 if(state.coins<price)return notify('資金が足りません','error');if(state.inventory.length+(state.active?1:0)>=limit())return notify('倉庫が満杯です','error');
 state.coins-=price;state.spent+=price;state.inventory.push({...offer,purchasePrice:price});state.offers.splice(ix,1);refillOffers();mutate();notify(`${offer.name} を仕入れた！`,'good');return;
 }
 if(action==='activate'){activate(Number(id));return;}
 if(action==='contract'){if(state.active||state.inventory.length||state.coins>=Math.min(...state.offers.map(marketPrice)))return;const o=generateOffer(1);o.kind='handheld';o.name='お客さんの携帯ゲーム機';o.baseValue=115;o.price=0;o.purchasePrice=0;o.isContract=true;o.stages=[{type:'clean',seed:rnd(101,99999)},{type:'wires',seed:rnd(101,99999)}];o.stageIndex=0;o.integrity=100;o.complete=false;o.broken=false;o.shield=false;state.active=o;initStage();currentTab='work';mutate();notify('小口修理を引き受けた！','good');return;}
 if(action==='wire-start'){const a=state.active;if(!a||taskOf()?.type!=='wires')return;if(a.stageState.done.includes(Number(id)))return;selectedWire=Number(id);render();return;}
 if(action==='wire-end'){const a=state.active;if(!a||taskOf()?.type!=='wires'||selectedWire<0)return;const result=Number(id)===selectedWire;const src=selectedWire;selectedWire=-1;if(result){if(!a.stageState.done.includes(src))a.stageState.done.push(src);if(a.stageState.done.length===a.stageState.count)finishStep();else mutate();}else damage();return;}
 if(action==='screw-start'){const a=state.active;if(!a||taskOf()?.type!=='screws')return;a.stageState.started=true;mutate();return;}
 if(action==='screw-turn'){const a=state.active;if(!a||taskOf()?.type!=='screws'||!a.stageState.started)return;const st=a.stageState,seq=shuffleIndex(st.count,taskOf().seed),number=Number(id);if(st.removed.includes(number))return;if(number===seq[st.removed.length]){st.removed.push(number);if(st.removed.length===st.count)finishStep();else mutate();}else{st.started=a.difficulty<=2;damage();}return;}
 if(action==='circuit-turn'){const a=state.active;if(!a||taskOf()?.type!=='circuit')return;const i=Number(id),path=circuitPath(a.difficulty);if(!Number.isInteger(i)||i<0||i>=path.length)return;a.stageState.angles[i]=(a.stageState.angles[i]+1)%4;if(solvedCircuit(a))finishStep();else mutate();return;}
 if(action==='time-stop'){const a=state.active,t=taskOf();if(!a||!t||t.type!=='calibrate')return;const center=25+(t.seed%51),width=clamp(24-a.difficulty*3,6,21);if(Math.abs(lastTiming-center)<=width/2)finishStep();else damage();return;}
 if(action==='buy-tool'){const tool=TOOLS.find(x=>x.id===id);if(!tool)return;if(({clean:1,shield:1,wire:2,screw:2,precision:3,circuit:4,auto:3}[id]||1)>state.townLevel)return;if(state.coins<tool.cost)return notify('お金が足りません','error');state.coins-=tool.cost;state.spent+=tool.cost;state.tools[id]++;mutate();notify(`${tool.name} を購入した！`,'good');return;}
 if(action==='use-tool'){const a=state.active,t=taskOf(),tool=TOOLS.find(x=>x.id===id);if(!a||!t||!tool||!state.tools[id]||a.complete||a.broken)return;
 if(tool.stage&&tool.stage!==t.type)return; if(id==='shield'){if(a.shield)return;state.tools.shield--;a.shield=true;mutate();notify('🛡️ 次の失敗を1回防ぎます','good');return;}
 state.tools[id]--;
 if(id==='auto'){a.stageIndex=a.stages.length;a.complete=true;a.quality=repairQuality(a);mutate();notify('⚡ 全工程の修理が完了！','good');return;}
 finishStep(true);return;
 }
 if(action==='sell'){const a=state.active;if(!a?.complete)return;const price=saleValue(a);state.coins+=price;state.revenue+=price;state.fame+=3+a.difficulty*3;state.completed++;state.active=null;mutate();notify(`${a.name} を $${n(price)} で販売！`,'good');return;}
 if(action==='collect'){const a=state.active;if(!a?.complete||a.isContract)return;const points=Math.round((11+a.difficulty*15)*(state.upgrades.showcase?1.5:1));a.quality=repairQuality(a);state.collection.push(a);state.fame+=points;state.completed++;state.active=null;mutate();notify(`🏆 コレクション追加！ 評判 +${points}`,'good');return;}
 if(action==='scrap'){const a=state.active;if(!a)return;const salvage=a.isContract?0:(a.broken?Math.round(a.baseValue*.11):Math.round(a.purchasePrice*.24));if(!a.broken&&!confirm(`修理をやめて $${n(salvage)} で処分しますか？`))return;state.coins+=salvage;state.revenue+=salvage;state.active=null;mutate();notify(`部品を回収して $${n(salvage)} を得た`);return;}
 if(action==='upgrade'){const up=UPGRADES.find(x=>x.id===id);if(!up||state.upgrades[id]||state.coins<up.cost)return;state.coins-=up.cost;state.spent+=up.cost;state.upgrades[id]=true;mutate();notify(`${up.name} を導入した！`,'good');return;}
}
app.addEventListener('click',e=>{const btn=e.target.closest('button[data-action]');if(!btn||btn.disabled)return;handleAction(btn.dataset.action,btn.dataset.id);});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&currentTab==='work'&&taskOf()?.type==='calibrate'&&!e.repeat){e.preventDefault();handleAction('time-stop');}});
load();if(!blockedSave)render();
})();

</script>
