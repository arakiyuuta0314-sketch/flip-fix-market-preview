function baseSave(){return {version:SAVE_VERSION,coins:460,fame:0,completed:0,failures:0,revenue:0,spent:0,nextId:1,inventory:[],active:null,offers:[],collection:[],upgrades:{bench:false,dealer:false,showcase:false,warehouse:false},tools:{clean:1,wire:0,precision:0,screw:0,circuit:0,shield:1,auto:0}};}
function load(){
 try{
   const raw=storage.getItem(KEY);
   if (!raw) {state=baseSave();refillOffers();persist();return;}
   const data=JSON.parse(raw);
   if(!Array.isArray(data.inventory) || !Array.isArray(data.offers) || !Array.isArray(data.collection) || !Number.isFinite(data.coins) || !data.tools || !data.upgrades) throw Error('保存データの形式が不正です。');
   if(data.version===1){data.tools.screw=0;data.tools.circuit=0;data.version=SAVE_VERSION;}
   if(data.version!==SAVE_VERSION) throw Error('未対応の保存データです。上書きせず停止します。');
   state=data;persist();
 } catch(e){
   blockedSave=true;state=baseSave();refillOffers();
   app.innerHTML=`<main class="shell"><div class="save-error"><h2>保存データを読み込めませんでした</h2><p>${String(e.message).replaceAll('<','&lt;')}</p><p>上書きを避けるため、ゲームを停止しています。バックアップを取ってから初期化してください。</p><button class="btn danger" id="erase-broken">データを初期化する</button></div></main>`;
   document.getElementById('erase-broken').addEventListener('click',()=>{if(confirm('保存データを削除して最初から始めますか？')){storage.removeItem(KEY);location.reload();}});
   return;
 }
}
function persist(){if(blockedSave) return;try{storage.setItem(KEY,JSON.stringify(state));const e=document.querySelector('#save-state');if(e)e.textContent=storageAvailable?'● オートセーブ済み':'⚠ 保存不可・体験のみ';}catch(e){notify('セーブに失敗しました。ブラウザの保存設定を確認してください。','error');}}
function mutate(){persist();render();}
function notify(message,type=''){const old=document.querySelector('.toast');if(old)old.remove();clearTimeout(toastHandle);const el=document.createElement('div');el.className='toast '+type;el.textContent=message;document.body.appendChild(el);toastHandle=setTimeout(()=>el.remove(),3100);}
function tier(){return clamp(1+Math.floor((state.completed+state.fame/20)/4),1,5);}
function limit(){return state.upgrades.warehouse?6:3;}

function marketPrice(o){return Math.max(1,Math.round(o.price*(state.upgrades.dealer?.9:1)));}
function generateOffer(forcedDifficulty){
 const kind=KIND[rnd(0,KIND.length-1)];
 const max=clamp(tier()+1,2,5);
 const difficulty=forcedDifficulty||rnd(1,max);
 const rarities=['COMMON','UNCOMMON','RARE','EPIC','LEGENDARY'];
 const rarityIndex=Math.min(4, Math.max(0,difficulty-1)+(rnd(1,7)===7?1:0));
 const baseValue=Math.round((kind.base + (difficulty-1)*170)*(1+rarityIndex*.12));
 const price=Math.round(baseValue*(.33+difficulty*.035));
 const pool=['clean','wires','calibrate','screws','circuit'];
 const stages=[];
 for(let i=0;i<difficulty+1;i++) stages.push({type:pool[(i+kind.base)%pool.length],seed:rnd(101,99999)});
 // Ensure the first tutorial item opens with the cleaning stage.
 if(forcedDifficulty===1)stages[0]={type:'clean',seed:rnd(101,99999)};
 return {id:state.nextId++,kind:kind.id,name:kind.name,baseValue,price,difficulty,rarity:rarities[rarityIndex],stages};
}
function refillOffers(){while(state.offers.length<3)state.offers.push(generateOffer(state.completed===0&&state.offers.length===0?1:null));}
function taskOf(){if(!state.active||state.active.stageIndex>=state.active.stages.length) return null;return state.active.stages[state.active.stageIndex];}
function shuffleIndex(count,seed){const a=[...Array(count).keys()];let x=seed>>>0;for(let i=count-1;i>0;i--){x=(1664525*x+1013904223)>>>0;const j=x%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function initStage(){const a=state.active,t=taskOf();if(!t) return;
 if(t.type==='clean'){const spots=clamp(2+a.difficulty+Math.floor(a.stageIndex/2),3,8);a.stageState={cleaned:[],count:spots};}
 if(t.type==='wires'){a.stageState={done:[],count:clamp(2+Math.floor(a.difficulty/2),2,5)};}
 if(t.type==='calibrate'){a.stageState={};}
 if(t.type==='screws'){a.stageState={removed:[],count:clamp(2+a.difficulty,3,7),started:a.difficulty<=2};}
 if(t.type==='circuit'){const path=circuitPath(a.difficulty);a.stageState={angles:path.map((_,i)=>((t.seed>>(i%8))+i*3)%4)};}
 selectedWire=-1;
}
function circuitPath(difficulty){return difficulty<3?[3,4,5]:difficulty<5?[0,1,4,7,8]:[0,1,2,5,4,7,8];}
function directionBetween(from,to){const d=to-from;if(d===1)return 1;if(d===3)return 2;if(d===-1)return 3;if(d===-3)return 0;throw Error('回路のルートが不正です。');}
function circuitConnectors(path,i){const prev=i===0?3:directionBetween(path[i],path[i-1]);const next=i===path.length-1?1:directionBetween(path[i],path[i+1]);return [prev,next];}
function solvedCircuit(a){const path=circuitPath(a.difficulty);return path.every((_,i)=>{const d=circuitConnectors(path,i);const turned=d.map(x=>(x+a.stageState.angles[i])%4).sort().join(',');return turned===d.slice().sort().join(',');});}
function repairQuality(a){return clamp(Math.round(94 - (100-a.integrity)*.62+(state.upgrades.bench?5:0)),5,100);}
function saleValue(a){return Math.round(a.baseValue*(.52+repairQuality(a)*.005));}
function damage(){const a=state.active;if(!a||a.complete||a.broken)return;
 state.failures++;
 if(a.shield){a.shield=false;notify('🛡️ 保護フィルムが失敗を防いだ！','good');mutate();return;}
 const hit=11+a.difficulty*3-(state.upgrades.bench?3:0);
 a.integrity=clamp(a.integrity-hit,0,100);
 if(a.integrity<=12){a.broken=true;notify('修復不能！ ジャンク品として処分できます。','error');}
 else notify(`失敗！ 本体の耐久度 -${hit}%`,'error');
 mutate();
}
function finishStep(auto=false){const a=state.active;if(!a||a.complete||a.broken)return;
 a.stageIndex++;
 if(a.stageIndex>=a.stages.length){a.complete=true;a.quality=repairQuality(a);notify(auto?'⚡ 自動修理完了！':'✨ 修理成功！ お見事！','good');}
 else {initStage();if(auto)notify('⚡ 工程を自動で完了！','good');else notify('工程クリア！ 次の修理へ','good');}
 mutate();
}

function renderInventory(){if(!state.inventory.length)return `<div class="empty"><div class="big-emoji">🛠️</div><h3>作業台は空っぽ</h3><p>市場で商品を仕入れたら、ここで修理に挑戦しよう。失敗すると耐久度が下がるので注意！</p><button class="btn" data-action="tab" data-id="market">📦 商品を仕入れる</button>${state.coins<Math.min(...state.offers.map(marketPrice))?'<div class="section-block"><p class="sub">資金が尽きても復帰できるよう、無料の小口修理依頼を受けられます。</p><button class="btn ghost" data-action="contract">🧰 小口修理の仕事を受ける（無料）</button></div>':''}</div>`;return `<div class="cards-grid">${state.inventory.map(x=>itemCard(x,'inventory')).join('')}</div>`;}
function activeWorkbench(a){
 const progress=a.stageIndex/a.stages.length;
 let stageArea;
 if(a.broken) stageArea=`<div class="result-card"><h3>💥 修理不能になった…</h3><p>本体が損傷してしまった。少しだけ部品代を回収できる。</p><div class="total">$${n(Math.round(a.baseValue*.11))}</div><button class="btn danger block" data-action="scrap">ジャンク品として処分</button></div>`;
 else if(a.complete)stageArea=`<div class="result-card"><div class="eyebrow">REPAIR COMPLETE</div><h3>✨ ${a.name} 復活！</h3><p class="sub">修復品質 ${repairQuality(a)}% • 仕入れ価格 $${n(a.purchasePrice)}</p><div class="total">$${n(saleValue(a))}</div><p class="sub">仕入れ差額：$${n(saleValue(a)-a.purchasePrice)}（消耗品代は別）</p><p class="sub">販売すれば資金を獲得。展示すれば評判が上がり、より難しい商品が出現。</p><div class="inline-actions section-block"><button class="btn" data-action="sell">💰 この価格で売る</button>${a.isContract?'':`<button class="btn secondary" data-action="collect">🏆 展示する</button>`}</div></div>`;
 else stageArea=renderMinigame(a);
 return `<div class="workshop-grid"><section class="panel padded"><div class="row between"><div><span class="tag ${a.rarity==='LEGENDARY'?'legend':''}">${a.rarity}</span><h3 style="margin:5px 0 0;font-size:19px">${a.name}</h3></div><div class="stars">${stars(a.difficulty)}</div></div><div class="art-frame large" style="margin-top:13px">${renderObjectSvg(a)}</div><div class="statline"><span class="muted">本体の耐久度（ミスで減少）</span><b>${a.integrity}% ${a.shield?'🛡️':''}</b></div><div class="condition-track"><span style="width:${a.integrity}%"></span></div><div class="statline"><span class="muted">修理の進捗</span><b>${a.stageIndex}/${a.stages.length} 工程</b></div><div class="step-progress">${a.stages.map((s,i)=>`<span class="${i<a.stageIndex?'done':i===a.stageIndex?'current':''}" title="${STAGES[s.type].name}"></span>`).join('')}</div><div class="row between"><span class="muted tiny">購入価格：$${n(a.purchasePrice)}</span>${a.broken||a.complete?'':'<button class="btn danger sm" data-action="scrap">途中で諦める</button>'}</div></section>
 <section class="panel workshop-controls">${stageArea}${!a.complete&&!a.broken?`<div class="section-block"><div class="main-card-title"><h3>🧰 使い切りアイテム</h3><button class="btn ghost sm" data-action="tab" data-id="tools">買い足す →</button></div><div class="tools-grid">${TOOLS.map(tool=>`<button class="tool-btn" data-action="use-tool" data-id="${tool.id}" ${state.tools[tool.id]===0 || (tool.stage && tool.stage!==taskOf()?.type) || (tool.id==='shield'&&a.shield)?'disabled':''}>${tool.icon} ${tool.name}<small>所持 ${state.tools[tool.id]} 個${tool.id==='shield'&&a.shield?' • 使用中':''}</small></button>`).join('')}</div></div>`:''}</section></div>
 ${state.inventory.length?`<section class="panel padded section-block"><div class="main-card-title"><h3>📦 倉庫の在庫（${state.inventory.length}個）</h3><span class="muted tiny">いまの修理を終えたら次の商品へ</span></div><div class="row" style="flex-wrap:wrap">${state.inventory.map(x=>`<span class="pill">${x.name} ${stars(x.difficulty)}</span>`).join('')}</div></section>`:''}`;
}
function cleanLocations(count,seed){const pos=[];let x=seed>>>0;for(let i=0;i<count;i++){x=(1664525*x+1013904223)>>>0;const xp=19+(x%63);x=(1664525*x+1013904223)>>>0;const yp=22+(x%55);pos.push([xp,yp]);}return pos;}
function renderMinigame(a){const t=taskOf(),st=a.stageState||{},def=STAGES[t.type];let inside='';
 if(t.type==='clean'){const coords=cleanLocations(st.count,t.seed);inside=`<div class="clean-pad" id="clean-pad" aria-label="汚れをなぞって落とす">${coords.map(([x,y],i)=>`<span class="clean-spot ${(st.cleaned||[]).includes(i)?'is-clean':''}" data-spot="${i}" style="left:${x}%;top:${y}%"></span>`).join('')}</div><p class="game-tip">${(st.cleaned||[]).length}/${st.count} 個の汚れを除去 • マウス/指でなぞる</p>`;}
 if(t.type==='wires'){const count=st.count,order=shuffleIndex(count,t.seed);let paths='';for(let i=0;i<count;i++)if(st.done.includes(i)){const y1=(15+ i*(145/(count-1)) +18),k=order.indexOf(i),y2=(15+k*(145/(count-1))+18);paths+=`<path d="M55 ${y1} C130 ${y1},125 ${y2},${290} ${y2}" stroke="${COLORS[i]}" stroke-width="5" fill="none" stroke-linecap="round" opacity=".85"/>`;}
 inside=`<div class="wire-pad"><svg viewBox="0 0 344 176" preserveAspectRatio="none" class="wire-lines">${paths}</svg><div class="terminal-col">${Array.from({length:count},(_,i)=>`<button class="terminal ${selectedWire===i?'selected':''} ${st.done.includes(i)?'done':''}" style="background:${COLORS[i]}" data-action="wire-start" data-id="${i}" ${st.done.includes(i)?'disabled':''} aria-label="左の${i+1}番の端子"></button>`).join('')}</div><div class="terminal-col">${order.map((val,i)=>`<button class="terminal ${st.done.includes(val)?'done':''}" style="background:${COLORS[val]}" data-action="wire-end" data-id="${val}" ${st.done.includes(val)?'disabled':''} aria-label="右の${i+1}番の端子"></button>`).join('')}</div></div><p class="game-tip">${st.done.length}/${count} 本接続 • 間違った組み合わせはダメージ</p>`;
 }
 if(t.type==='screws'){const seq=shuffleIndex(st.count,t.seed);const visible=!st.started||a.difficulty<=2;inside=`<div class="screw-panel"><div class="screw-sequence">${visible?'外す順番：'+seq.map(i=>i+1).join(' → '):'順番は非表示です。記憶した順番で外そう！'}</div>${!st.started?`<button class="btn block" data-action="screw-start">🪛 覚えた！ 分解開始</button>`:`<div class="screw-grid">${Array.from({length:st.count},(_,i)=>`<button class="screw-head ${st.removed.includes(i)?'removed':''}" data-action="screw-turn" data-id="${i}" ${st.removed.includes(i)?'disabled':''} aria-label="ネジ ${i+1}">${i+1}<small>✕</small></button>`).join('')}</div>`}</div><p class="game-tip">${st.removed.length}/${st.count} 本分解 • 間違えると本体を傷つけます</p>`;}
 if(t.type==='circuit'){const path=circuitPath(a.difficulty);const aMap=new Map(path.map((v,i)=>[v,i]));inside=`<div class="circuit-panel"><div class="circuit-labels"><b>⚡ INPUT</b><span>タップで90°回転</span><b>OUTPUT ⚡</b></div><div class="circuit-grid">${Array.from({length:9},(_,slot)=>{const i=aMap.get(slot);if(i===undefined)return '<div class="circuit-empty"></div>';const dir=circuitConnectors(path,i),angle=st.angles[i];return `<button class="circuit-tile" data-action="circuit-turn" data-id="${i}" aria-label="回路パネル ${i+1} を回転"><svg viewBox="0 0 100 100" aria-hidden="true"><g transform="rotate(${angle*90},50,50)"><circle cx="50" cy="50" r="15" fill="#fed58f"/>${dir.map(d=>{const e=[[50,0],[100,50],[50,100],[0,50]][d];return `<path d="M50 50 L${e[0]} ${e[1]}" stroke="#94efcc" stroke-width="13" stroke-linecap="round"/>`;}).join('')}</g></svg></button>`;}).join('')}</div></div><p class="game-tip">緑の配線が入口と出口をつなぐように回転。すべて通れば成功！</p>`;}
 if(t.type==='calibrate'){const center=25+(t.seed%51),width=clamp(24-a.difficulty*3,6,21);inside=`<div class="calibration-pad"><div class="row between"><span class="muted tiny">MIN</span><b style="color:var(--mint)">SWEET SPOT</b><span class="muted tiny">MAX</span></div><div class="slider-rail"><div class="slider-target" style="left:${center-width/2}%;width:${width}%"></div><div class="slider-needle" id="needle" style="left:50%"></div></div><button class="btn block" data-action="time-stop">🎯 ここで止める！ (Space)</button></div><p class="game-tip">針が緑の範囲にある時だけ成功。精密操作ほど範囲が狭い。</p>`;}
 return `<div class="eyebrow">REPAIR TASK ${a.stageIndex+1} / ${a.stages.length}</div><div class="minigame"><h3>${def.icon} ${def.name}</h3><p>${def.tip}</p>${inside}</div><div class="hint section-block">⚠️ 修理ミスで本体耐久度が減少。残り12%以下になると修復不能。保護フィルムは次のミスを1回防ぎます。</div>`;
}
function renderTools(){return `${title('TOOLS & UPGRADES','アイテムショップ','ゲーム内のお金を使って、修理の効率を上げたりお店を育てよう。')}
 <div class="eyebrow section-block">CONSUMABLES · 使い切りアイテム</div><div class="stack">${TOOLS.map(x=>`<div class="shop-item"><div class="shop-icon">${x.icon}</div><div class="shop-desc"><h3>${x.name} <span class="pill">所持 ${state.tools[x.id]}</span></h3><p>${x.desc}</p></div><div class="shop-price">$${n(x.cost)}</div><button class="btn sm" data-action="buy-tool" data-id="${x.id}" ${state.coins<x.cost?'disabled':''}>購入</button></div>`).join('')}</div>
 <div class="eyebrow section-block" style="margin-top:25px">PERMANENT · 永続アップグレード</div><div class="upgrade-grid">${UPGRADES.map(x=>`<div class="shop-item"><div class="shop-icon">${x.icon}</div><div class="shop-desc"><h3>${x.name}</h3><p>${x.desc}</p><span class="shop-price">$${n(x.cost)}</span></div><button class="btn sm ${state.upgrades[x.id]?'secondary':''}" data-action="upgrade" data-id="${x.id}" ${state.upgrades[x.id]||state.coins<x.cost?'disabled':''}>${state.upgrades[x.id]?'購入済':'購入'}</button></div>`).join('')}</div><div class="hint section-block">💡 消耗品で手間と失敗リスクを減らせる一方、購入費用が利益を圧迫することも。何に投資するかが経営のポイント。</div>`;}
function renderGallery(){return `${title('THE COLLECTION','コレクション','売らずに残した特別な修理品。展示すると評判が上がる。')}${state.collection.length?`<div class="cards-grid">${state.collection.map(x=>`<div class="gallery-card"><span class="tag ${x.rarity==='LEGENDARY'?'legend':''}">${x.rarity}</span><div class="art-frame" style="margin-top:8px">${renderObjectSvg(x)}</div><h3 class="item-name">${x.name}</h3><p class="item-sub">修復品質 ${x.quality}% • 難易度 ${stars(x.difficulty)}</p></div>`).join('')}</div>`:`<div class="empty"><div class="big-emoji">🏆</div><h3>まだ展示品がありません</h3><p>商品を修理したら、販売せずに「展示する」を選べます。貴重な品を集めて、伝説のお店を目指そう。</p><button class="btn" data-action="tab" data-id="market">📦 市場で探す</button></div>`}
 <section class="panel padded section-block"><div class="row between"><h3 style="margin:0">🌟 展示特典</h3><b class="light">評判 ${state.fame} pt</b></div><p class="sub">現在の仕入れ市場ティア ${tier()}/5。修理品を売っても少し評判が増え、展示すると多く増える。</p></section>`;}
function bindCleaning(){const pad=document.getElementById('clean-pad');if(!pad)return;
 const hit=(event)=>{const a=state.active,t=taskOf();if(!a||!t||t.type!=='clean')return;const r=pad.getBoundingClientRect();if(r.width===0)return;const x=(event.clientX-r.left)/r.width*100,y=(event.clientY-r.top)/r.height*100;const spots=cleanLocations(a.stageState.count,t.seed);
 let changed=false;for(let i=0;i<spots.length;i++){const [sx,sy]=spots[i];if(Math.abs((x-sx)*r.width/100)<30&&Math.abs((y-sy)*r.height/100)<26&&!a.stageState.cleaned.includes(i)){a.stageState.cleaned.push(i);const el=pad.querySelector(`[data-spot="${i}"]`);if(el)el.classList.add('is-clean');changed=true;}}
 if(changed){persist();const label=pad.parentElement?.querySelector('.game-tip');if(label)label.textContent=`${a.stageState.cleaned.length}/${a.stageState.count} 個の汚れを除去 • マウス/指でなぞる`;if(a.stageState.cleaned.length===a.stageState.count){dragging=false;finishStep();}}
 };
 pad.addEventListener('pointerdown',e=>{dragging=true;pad.setPointerCapture?.(e.pointerId);hit(e);});pad.addEventListener('pointermove',e=>{if(dragging)hit(e)});pad.addEventListener('pointerup',()=>dragging=false);pad.addEventListener('pointercancel',()=>dragging=false);
}
function startCalibration(){const task=taskOf();if(!task)return;const needle=document.getElementById('needle');if(!needle)return;let start=performance.now();let seed=task.seed;const speed=.0018+state.active.difficulty*.00055;function draw(time){lastTiming=50+47*Math.sin((time-start)*speed+seed%11);needle.style.left=lastTiming+'%';timingRaf=requestAnimationFrame(draw);}timingRaf=requestAnimationFrame(draw);}
function activate(id){if(state.active)return notify('先に作業台の修理を終えてください。','error');const ix=state.inventory.findIndex(x=>x.id===id);if(ix<0)return;const a=state.inventory.splice(ix,1)[0];a.stageIndex=0;a.integrity=100;a.complete=false;a.broken=false;a.shield=false;state.active=a;initStage();currentTab='work';mutate();}
function resetAll(){if(confirm('すべての進行状況を削除してニューゲームを始めますか？この操作は取り消せません。')){state=baseSave();refillOffers();currentTab='shop';mutate();notify('新しいお店をオープン！','good');}}
function handleAction(action,id){
 if(action==='tab'){currentTab=id;selectedWire=-1;render();return;}
 if(action==='reset'){resetAll();return;}
 if(action==='refresh'){if(state.coins<25)return notify('お金が足りません','error');state.coins-=25;state.spent+=25;state.offers=[];refillOffers();mutate();notify('新しい商品が入荷！');return;}
 if(action==='buy'){
 const ix=state.offers.findIndex(x=>String(x.id)===String(id));if(ix<0)return;const offer=state.offers[ix],price=marketPrice(offer);
 if(state.coins<price)return notify('資金が足りません','error');if(state.inventory.length+(state.active?1:0)>=limit())return notify('倉庫が満杯です','error');
 state.coins-=price;state.spent+=price;state.inventory.push({...offer,purchasePrice:price});state.offers.splice(ix,1);refillOffers();mutate();notify(`${offer.name} を仕入れた！`,'good');return;
 }
 if(action==='activate'){activate(Number(id));return;}
 if(action==='contract'){if(state.active||state.inventory.length||state.coins>=Math.min(...state.offers.map(marketPrice)))return;const o=generateOffer(1);o.kind='handheld';o.name='お客さんの携帯ゲーム機';o.baseValue=115;o.price=0;o.purchasePrice=0;o.isContract=true;o.stages=[{type:'clean',seed:rnd(101,99999)},{type:'wires',seed:rnd(101,99999)}];o.stageIndex=0;o.integrity=100;o.complete=false;o.broken=false;o.shield=false;state.active=o;initStage();currentTab='work';mutate();notify('小口修理を引き受けた！','good');return;}
 if(action==='wire-start'){const a=state.active;if(!a||taskOf()?.type!=='wires')return;if(a.stageState.done.includes(Number(id)))return;selectedWire=Number(id);render();return;}
 if(action==='wire-end'){const a=state.active;if(!a||taskOf()?.type!=='wires'||selectedWire<0)return;const result=Number(id)===selectedWire;const src=selectedWire;selectedWire=-1;if(result){if(!a.stageState.done.includes(src))a.stageState.done.push(src);if(a.stageState.done.length===a.stageState.count)finishStep();else mutate();}else damage();return;}
 if(action==='screw-start'){const a=state.active;if(!a||taskOf()?.type!=='screws')return;a.stageState.started=true;mutate();return;}
 if(action==='screw-turn'){const a=state.active;if(!a||taskOf()?.type!=='screws'||!a.stageState.started)return;const st=a.stageState,seq=shuffleIndex(st.count,taskOf().seed),number=Number(id);if(st.removed.includes(number))return;if(number===seq[st.removed.length]){st.removed.push(number);if(st.removed.length===st.count)finishStep();else mutate();}else{st.started=a.difficulty<=2;damage();}return;}
 if(action==='circuit-turn'){const a=state.active;if(!a||taskOf()?.type!=='circuit')return;const i=Number(id),path=circuitPath(a.difficulty);if(!Number.isInteger(i)||i<0||i>=path.length)return;a.stageState.angles[i]=(a.stageState.angles[i]+1)%4;if(solvedCircuit(a))finishStep();else mutate();return;}
 if(action==='time-stop'){const a=state.active,t=taskOf();if(!a||!t||t.type!=='calibrate')return;const center=25+(t.seed%51),width=clamp(24-a.difficulty*3,6,21);if(Math.abs(lastTiming-center)<=width/2)finishStep();else damage();return;}
 if(action==='buy-tool'){const tool=TOOLS.find(x=>x.id===id);if(!tool)return;if(state.coins<tool.cost)return notify('お金が足りません','error');state.coins-=tool.cost;state.spent+=tool.cost;state.tools[id]++;mutate();notify(`${tool.name} を購入した！`,'good');return;}
 if(action==='use-tool'){const a=state.active,t=taskOf(),tool=TOOLS.find(x=>x.id===id);if(!a||!t||!tool||!state.tools[id]||a.complete||a.broken)return;
 if(tool.stage&&tool.stage!==t.type)return; if(id==='shield'){if(a.shield)return;state.tools.shield--;a.shield=true;mutate();notify('🛡️ 次の失敗を1回防ぎます','good');return;}
 state.tools[id]--;
 if(id==='auto'){a.stageIndex=a.stages.length;a.complete=true;a.quality=repairQuality(a);mutate();notify('⚡ 全工程の修理が完了！','good');return;}
 finishStep(true);return;
 }
 if(action==='sell'){const a=state.active;if(!a?.complete)return;const price=saleValue(a);state.coins+=price;state.revenue+=price;state.fame+=3+a.difficulty*3;state.completed++;state.active=null;mutate();notify(`${a.name} を $${n(price)} で販売！`,'good');return;}
 if(action==='collect'){const a=state.active;if(!a?.complete||a.isContract)return;const points=Math.round((11+a.difficulty*15)*(state.upgrades.showcase?1.5:1));a.quality=repairQuality(a);state.collection.push(a);state.fame+=points;state.completed++;state.active=null;mutate();notify(`🏆 コレクション追加！ 評判 +${points}`,'good');return;}
 if(action==='scrap'){const a=state.active;if(!a)return;const salvage=a.isContract?0:(a.broken?Math.round(a.baseValue*.11):Math.round(a.purchasePrice*.24));if(!a.broken&&!confirm(`修理をやめて $${n(salvage)} で処分しますか？`))return;state.coins+=salvage;state.revenue+=salvage;state.active=null;mutate();notify(`部品を回収して $${n(salvage)} を得た`);return;}
 if(action==='upgrade'){const up=UPGRADES.find(x=>x.id===id);if(!up||state.upgrades[id]||state.coins<up.cost)return;state.coins-=up.cost;state.spent+=up.cost;state.upgrades[id]=true;mutate();notify(`${up.name} を導入した！`,'good');return;}
}
app.addEventListener('click',e=>{const btn=e.target.closest('button[data-action]');if(!btn||btn.disabled)return;handleAction(btn.dataset.action,btn.dataset.id);});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&currentTab==='work'&&taskOf()?.type==='calibrate'&&!e.repeat){e.preventDefault();handleAction('time-stop');}});
load();if(!blockedSave)render();
})();

</script>
