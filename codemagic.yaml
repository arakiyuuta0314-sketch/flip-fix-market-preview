workflows:
  ios-unsigned-check:
    name: iOS simulator build check (no Apple signing)
    instance_type: mac_mini_m2
    max_build_duration: 30
    scripts:
      - name: Install JavaScript dependencies
        script: |
          cd ios-app
          npm ci
      - name: Sync Capacitor iOS project
        script: |
          cd ios-app
          npx cap sync ios
      - name: Compile iOS simulator app (unsigned)
        script: |
          cd ios-app
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO build

  ios-testflight:
    name: iOS TestFlight signed build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic Signing
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.flipfixmarket.game
      vars:
        XCODE_PROJECT: ios-app/ios/App/App.xcodeproj
        XCODE_SCHEME: App
    scripts:
      - name: Install JavaScript dependencies
        script: |
          cd ios-app
          npm ci
      - name: Sync Capacitor iOS project
        script: |
          cd ios-app
          npx cap sync ios
      - name: Set unique TestFlight build number
        script: |
          cd ios-app/ios/App
          xcrun agvtool new-version -all "$PROJECT_BUILD_NUMBER"
      - name: Set up signing
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Build signed IPA
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
      - name: Verify IPA artifact
        script: |
          echo "Searching for signed IPA files"
          find build ios-app/build -type f -name '*.ipa' -print 2>/dev/null || true
          IPA_COUNT=$(find build ios-app/build -type f -name '*.ipa' 2>/dev/null | wc -l | tr -d ' ')
          if [ "$IPA_COUNT" -eq 0 ]; then
            echo "ERROR: No IPA generated; refusing to report a successful TestFlight build"
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - ios-app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        beta_groups: []
        submit_to_app_store: false
