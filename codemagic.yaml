workflows:
  ios-unsigned-check:
    name: iOS simulator build check (no Apple signing)
    instance_type: mac_mini_m2
    max_build_duration: 30
    scripts:
      - name: Install JavaScript dependencies
        script: |
          cd ios-app
          npm ci
      - name: Sync Capacitor iOS project
        script: |
          cd ios-app
          npx cap sync ios
      - name: Compile iOS simulator app (unsigned)
        script: |
          cd ios-app
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO build

  ios-testflight:
    name: iOS TestFlight signed build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic Signing
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.flipfixmarket.game
      vars:
        XCODE_PROJECT: ios-app/ios/App/App.xcodeproj
        XCODE_SCHEME: App
    scripts:
      - name: Install JavaScript dependencies
        script: |
          cd ios-app
          npm ci
      - name: Sync Capacitor iOS project
        script: |
          cd ios-app
          npx cap sync ios
      - name: Set up signing
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Build signed IPA
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - ios-app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
